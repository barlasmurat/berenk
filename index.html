function takvimAylarCiz(t) {
  const kutu = $('#takvimAylar');
  const notSayisi = (ay) => Object.keys(t.notlar || {}).filter(k => k.startsWith(`${t.yil}-${String(ay).padStart(2,'0')}`)).length;
  kutu.innerHTML = t.aylar.map(ay => `
    <div class="bg-white rounded-3xl shadow-kart p-3" data-ay="${ay}">
      <canvas data-aytuval="${ay}" data-aytik="${ay}" class="w-full rounded-xl bg-kagit cursor-pointer"></canvas>
      <div class="flex flex-wrap gap-1 mt-2">
        <button class="btn btn-yan text-xs" data-ayis="not:${ay}">${T('notlar_btn')}${notSayisi(ay) ? ' (' + notSayisi(ay) + ')' : ''}</button>
        <button class="btn btn-sade text-xs" data-ayis="bilgi:${ay}">${(t.fotoBilgi || {})[ay] && ((t.fotoBilgi[ay].tarih) || (t.fotoBilgi[ay].yer)) ? '📍 ✓' : '📍'}</button>
        <button class="btn btn-sade text-xs" data-ayis="altnot:${ay}">${(t.altNotlar || {})[ay] ? '✍️ ✓' : '✍️'}</button>
        <button class="btn btn-sade text-xs" data-ayis="oniz:${ay}">🔍</button>
      </div>
    </div>`).join('');

  t.aylar.forEach(async ay => {
    const tuval = kutu.querySelector(`[data-aytuval="${ay}"]`);
    if (tuval) await takvimSayfaCiz(tuval, t, ay, .34);
  });
  // fotoğraf alanına tıklamak fotoğraf seçer, diğer yerler büyük önizleme açar
  $$('#takvimAylar [data-aytik]').forEach(tuval => tuval.onclick = (e) => {
    const ay = +tuval.dataset.aytik;
    const sb = sablonBul(t.sablon), {G, Y} = takvimBoyut(t.tip);
    const kutuOlcu = tuval.getBoundingClientRect();
    const mx = (e.clientX - kutuOlcu.left) / kutuOlcu.width * G;
    const my = (e.clientY - kutuOlcu.top) / kutuOlcu.height * Y;
    const f = sb.foto;
    const icinde = mx >= f.x && mx <= f.x + f.w && my >= f.y && my <= f.y + f.h;
    if (icinde) takvimFotoPencereAc(t, ay); else takvimOnizlemeAc(t, ay);
  });
  $$('#takvimAylar [data-ayis]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const [is, ay] = b.dataset.ayis.split(':');
    if (is === 'foto') takvimFotoPencereAc(t, +ay);
    if (is === 'not') takvimNotPencereAc(t, +ay);
    if (is === 'oniz') takvimOnizlemeAc(t, +ay);
    if (is === 'altnot') takvimAltNot(t, +ay);
    if (is === 'bilgi') fotoBilgiAc(t, +ay);
  });

  if (window.Sortable && t.aylar.length > 1) {
    takvimSortable = new Sortable(kutu, {
      animation: 160, ghostClass: 'surukleniyor', delay: 120, delayOnTouchOnly: true,
      filter: '.btn', preventOnFilter: false,
      onEnd: async () => {
        const yeniSira = Array.from(kutu.children).map(el => +el.dataset.ay);
        const fotolar = yeniSira.map(ay => (t.fotograflar || {})[ay] || null);
        const yeni = {};
        t.aylar.forEach((ay, i) => { if (fotolar[i]) yeni[ay] = fotolar[i]; });
        t.fotograflar = yeni;
        await takvimKaydet(t);
        takvimAylarCiz(t); takvimListeCiz();
      }
    });
  }
}

/* --- ay fotoğrafı seçimi --- */
let tfHedef = null;
function takvimFotoPencereAc(t, ay) {
  tfHedef = {t, ay};
  $('#tfBaslik').textContent = T('tf_baslik', {ay: ayAdi(t.yil, ay)});
  const sec = $('#tfAlbum');
  sec.innerHTML = durum.albumler.length
    ? `<option value="">${T('kaynak_album')}</option>` + durum.albumler.map(a => `<option value="${a.id}">${kacan(a.ad)}</option>`).join('')
    : `<option value="">${T('album_yok_kisa')}</option>`;
  $('#tfIzgara').innerHTML = '';
  $('#takvimFotoPencere').classList.remove('hidden');
}
function takvimFotoPencereKapat() { $('#takvimFotoPencere').classList.add('hidden'); tfHedef = null; }
async function tfAlbumCiz(albumId) {
  const kutu = $('#tfIzgara');
  const a = durum.albumler.find(x => x.id === albumId);
  if (!a) { kutu.innerHTML = ''; return; }
  const hepsi = tumFotograflar(a);
  kutu.innerHTML = hepsi.map((x, i) => `<button data-tfsec="${i}" class="rounded-xl overflow-hidden bg-kagit p-1">
      <img data-tfimg="${i}" alt="" class="w-full aspect-square object-contain"></button>`).join('');
  hepsi.forEach(async (x, i) => {
    const img = kutu.querySelector(`[data-tfimg="${i}"]`);
    const adres = await Depo.fotoAdres(a, x.grup, x.foto);
    if (img && adres) img.src = adres;
  });
  $$('[data-tfsec]', kutu).forEach(b => b.onclick = async () => {
    const x = hepsi[+b.dataset.tfsec];
    const blob = await Depo.fotoBlob(a, x.grup, x.foto);
    if (!blob) return;
    await takvimFotoAta(new File([blob], (x.foto.dosyaAdi || 'foto.jpg'), {type: blob.type || 'image/jpeg'}),
                        {tarih: x.foto.tarih || '', yer: x.foto.yer || ''});
  });
}
async function takvimFotoAta(dosya, hazirBilgi) {
  if (!tfHedef) return;
  const {t, ay} = tfHedef;
  bekle(T('hazirlaniyor'));
  const eski = (t.fotograflar || {})[ay];
  if (eski) await Depo.takvimFotoSil(t, eski);
  t.fotograflar = t.fotograflar || {};
  const imza = await fotoImza(dosya);
  const tekrar = imza && Object.keys(t.fotograflar).some(k => +k !== ay && t.fotograflar[k].imza === imza);
  const kayit = await Depo.takvimFotoYaz(t, ay, dosya);
  kayit.imza = imza;
  const exif = await exifOku(dosya);
  const tarih = (exif && exif.tarih) || (dosya.lastModified ? new Date(dosya.lastModified).toISOString().slice(0, 10) : '');
  t.fotoBilgi = t.fotoBilgi || {};
  t.fotoBilgi[ay] = hazirBilgi && (hazirBilgi.tarih || hazirBilgi.yer)
    ? {tarih: hazirBilgi.tarih || tarih, yer: hazirBilgi.yer || ''}
    : {tarih, yer: (t.fotoBilgi[ay] && t.fotoBilgi[ay].yer) || ''};
  t.fotograflar[ay] = kayit;
  if (exif && exif.lat) {
    yerAdiIste(exif.lat, exif.lon, async (ad) => {
      t.fotoBilgi[ay] = {tarih: t.fotoBilgi[ay].tarih, yer: t.fotoBilgi[ay].yer || ad};
      await takvimKaydet(t); takvimAylarCiz(t);
    });
  }
  await takvimKaydet(t);
  bekleKapat(); takvimFotoPencereKapat();
  takvimAylarCiz(t); takvimDetayCiz(); takvimListeCiz();
  if (tekrar) bildir(T('ayni_foto_takvim'), 'bilgi');
}

/* --- gün notları --- */
let tnHedef = null;
function takvimNotPencereAc(t, ay) {
  tnHedef = {t, ay};
  $('#tnBaslik').textContent = `${ayAdi(t.yil, ay)} ${t.yil}`;
  takvimNotCiz();
  $('#takvimNotPencere').classList.remove('hidden');
}
function takvimNotCiz() {
  if (!tnHedef) return;
  const {t, ay} = tnHedef;
  const gunSayisi = new Date(t.yil, ay, 0).getDate();
  const ilk = new Date(t.yil, ay - 1, 1).getDay();
  const kaydir = (ilk - t.haftaBaslangic + 7) % 7;
  const adlar = gunAdlari(t.haftaBaslangic);
  let html = adlar.map(a => `<div class="text-center text-[11px] font-semibold text-soluk">${kacan(a)}</div>`).join('');
  for (let i = 0; i < kaydir; i++) html += '<div></div>';
  for (let g = 1; g <= gunSayisi; g++) {
    const anahtar = gunAnahtar(t.yil, ay, g);
    const not = notNesne((t.notlar || {})[anahtar]);
    const tatil = (t.tatiller || {})[anahtar];
    html += `<button data-gun="${g}" title="${kacan(tatil || '')}"
      class="aspect-square rounded-lg text-sm font-semibold grid place-items-center relative
      ${not ? 'bg-lila text-white' : tatil ? 'bg-pembe/15 text-pembe' : 'bg-kagit'}">${g}${
        not && not.emoji ? `<span class="absolute bottom-0 right-0.5 text-[10px]">${not.emoji}</span>` : ''}</button>`;
  }
  $('#tnIzgara').innerHTML = html;
  $$('#tnIzgara [data-gun]').forEach(b => b.onclick = () => takvimNotDuzenle(+b.dataset.gun));
  const notlar = Object.keys(t.notlar || {}).filter(k => k.startsWith(`${t.yil}-${String(ay).padStart(2,'0')}`) && notNesne(t.notlar[k])).sort();
  $('#tnListe').innerHTML = notlar.map(k => `<div class="flex items-center gap-2 text-sm border border-cizgi rounded-xl px-3 py-1.5">
      <span class="font-semibold">${+k.slice(-2)}</span>
      <span class="flex-1 truncate">${kacan((notNesne(t.notlar[k]).emoji ? notNesne(t.notlar[k]).emoji + ' ' : '') + notNesne(t.notlar[k]).metin)}</span>
      <button class="btn btn-sade text-pembe" data-notsil="${k}">🗑️</button></div>`).join('');
  $$('[data-notsil]', $('#tnListe')).forEach(b => b.onclick = async () => {
    delete t.notlar[b.dataset.notsil];
    await takvimKaydet(t); takvimNotCiz(); takvimAylarCiz(t);
  });
}
async function takvimNotDuzenle(gun) {
  const {t, ay} = tnHedef;
  const anahtar = gunAnahtar(t.yil, ay, gun);
  const mevcut = (t.notlar || {})[anahtar];
  const sonuc = await gunNotSec(
    T('not_gun', {gun, ay: ayAdi(t.yil, ay)}),
    (t.tatiller || {})[anahtar] ? '🏳️ ' + t.tatiller[anahtar] : '',
    mevcut ? (mevcut.ref || null) : undefined
  );
  if (sonuc === null) return;
  t.notlar = t.notlar || {};
  if (sonuc.sil) delete t.notlar[anahtar];
  else t.notlar[anahtar] = {ref: sonuc.ref};
  await takvimKaydet(t);
  takvimNotCiz(); takvimAylarCiz(t); takvimListeCiz(); bugunSeritCiz();
}

/* Not tanımı ekleme penceresi: metin + gruplanmış emoji seçimi */
function notTanimPenceresi(baslangicMetin = '', baslangicEmoji = '') {
  return new Promise(cozum => {
    let secili = baslangicEmoji;
    $('#girdiBaslik').textContent = T('not_tanim_ekle');
    $('#girdiAciklama').textContent = '';
    $('#girdiAciklama').classList.add('hidden');
    $('#girdiAlanUzun').classList.add('hidden');
    $('#girdiAlan').classList.remove('hidden');
    $('#girdiTemizle').classList.remove('hidden');
    $('#girdiAlan').value = baslangicMetin;
    $('#girdiAlan').placeholder = T('not_ornek');
    $('#girdiHata').classList.add('hidden');
    const eski = $('#girdiEmoji'); if (eski) eski.remove();
    const kutu = document.createElement('div');
    kutu.id = 'girdiEmoji';
    kutu.className = 'mt-3 max-h-56 overflow-auto';
    kutu.innerHTML = `<p class="text-sm font-semibold mb-1">${T('emoji_sec')}</p>
      <div class="flex flex-wrap gap-1 mb-2"><button class="btn btn-yan text-xs" data-emoji="">${T('emoji_yok')}</button></div>` +
      EMOJI_GRUPLARI.map(g => `<p class="text-xs text-soluk mt-2 mb-1">${T(g.ad)}</p>
        <div class="flex flex-wrap gap-1">${g.liste.map(e => `<button class="btn btn-yan text-lg leading-none px-2" data-emoji="${e}">${e}</button>`).join('')}</div>`).join('');
    $('#girdiHata').parentNode.insertBefore(kutu, $('#girdiHata'));
    const isaretle = () => $$('[data-emoji]', kutu).forEach(b => {
      const s2 = b.dataset.emoji === secili;
      b.classList.toggle('btn-ana', s2); b.classList.toggle('btn-yan', !s2);
    });
    $$('[data-emoji]', kutu).forEach(b => b.onclick = () => { secili = b.dataset.emoji; isaretle(); });
    isaretle();
    const pencere = $('#girdiPencere');
    pencere.classList.remove('hidden');
    setTimeout(() => $('#girdiAlan').focus(), 40);
    function kapat(sonuc) {
      pencere.classList.add('hidden'); kutu.remove();
      $('#girdiTamam').onclick = null; $('#girdiIptal').onclick = null; $('#girdiTemizle').onclick = null; $('#girdiAlan').onkeydown = null;
      cozum(sonuc);
    }
    async function onayla() {
      const metin = $('#girdiAlan').value.trim();
      if (!metin) { $('#girdiHata').textContent = T('ad_gerekli'); $('#girdiHata').classList.remove('hidden'); return; }
      const tanim = await notTanimEkle(metin, secili);
      kapat(tanim);
    }
    $('#girdiTamam').onclick = onayla;
    $('#girdiIptal').onclick = () => kapat(null);
    $('#girdiTemizle').onclick = () => { $('#girdiAlan').value = ''; $('#girdiAlan').focus(); };
    $('#girdiAlan').onkeydown = (e) => { if (e.key === 'Enter') onayla(); if (e.key === 'Escape') kapat(null); };
  });
}

/* Bir güne not iliştirme: havuzdan seç ya da yeni tanımla */
function gunNotSec(baslik, aciklama, mevcutRef) {
  return new Promise(cozum => {
    const pencere = $('#girdiPencere');
    $('#girdiBaslik').textContent = baslik;
    $('#girdiAciklama').textContent = aciklama || '';
    $('#girdiAciklama').classList.toggle('hidden', !aciklama);
    $('#girdiAlan').classList.add('hidden');
    $('#girdiAlanUzun').classList.add('hidden');
    $('#girdiTemizle').classList.add('hidden');
    $('#girdiHata').classList.add('hidden');
    const eski = $('#girdiEmoji'); if (eski) eski.remove();
    const kutu = document.createElement('div');
    kutu.id = 'girdiEmoji';
    kutu.className = 'mt-1 max-h-64 overflow-auto';
    kutu.innerHTML = `<p class="text-sm font-semibold mb-1">${T('hazir_notlar')}</p>
      <div class="flex flex-col gap-1">
        ${durum.notTanimlari.length
          ? durum.notTanimlari.map(n => `<button class="btn ${n.id === mevcutRef ? 'btn-ana' : 'btn-yan'} justify-start text-sm" data-ntanim="${n.id}">
              <span class="w-6">${n.emoji || ''}</span>${kacan(n.metin)}</button>`).join('')
          : `<p class="text-soluk text-xs">${T('not_tanim_yok')}</p>`}
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        <button class="btn btn-foto text-sm" data-nyeni="1">${T('not_tanim_ekle')}</button>
        ${mevcutRef !== undefined && mevcutRef !== null ? `<button class="btn btn-yan text-sm text-pembe" data-nkaldir="1">${T('not_kaldir')}</button>` : ''}
      </div>`;
    $('#girdiHata').parentNode.insertBefore(kutu, $('#girdiHata'));
    $('#girdiTamam').classList.add('hidden');
    pencere.classList.remove('hidden');
    function kapat(sonuc) {
      pencere.classList.add('hidden'); kutu.remove();
      $('#girdiTamam').classList.remove('hidden');
      $('#girdiAlan').classList.remove('hidden');
      $('#girdiIptal').onclick = null;
      cozum(sonuc);
    }
    $$('[data-ntanim]', kutu).forEach(b => b.onclick = () => kapat({ref: b.dataset.ntanim}));
    $$('[data-nkaldir]', kutu).forEach(b => b.onclick = () => kapat({sil: true}));
    $$('[data-nyeni]', kutu).forEach(b => b.onclick = async () => {
      kutu.remove(); pencere.classList.add('hidden'); $('#girdiTamam').classList.remove('hidden'); $('#girdiAlan').classList.remove('hidden');
      const tanim = await notTanimPenceresi();
      if (tanim) { $('#girdiIptal').onclick = null; cozum({ref: tanim.id}); }
      else { $('#girdiIptal').onclick = null; cozum(null); }
    });
    $('#girdiIptal').onclick = () => kapat(null);
  });
}

/* --- başka bir takvimden kopyalama: fotoğraflar ve/veya notlar --- */
let nkHedefTakvim = null, nkSecim = null;
const nkSecenek = () => ({
  foto: $('[data-nktur="foto"]').checked,
  not: $('[data-nktur="not"]').checked,
  altnot: $('[data-nktur="altnot"]').checked
});
function notKopyaAc(t) {
  if (durum.takvimler.length < 2) return bildir(T('not_kopyala_tek'), 'hata');
  nkHedefTakvim = t;
  $$('#nkTur [data-nktur]').forEach(i => i.checked = true);
  $('#nkKaynak').innerHTML = durum.takvimler.filter(x => x.id !== t.id)
    .map(x => `<option value="${x.id}">${kacan(x.ad)} (${x.yil})</option>`).join('');
  nkSecimSifirla();
  notKopyaCiz();
  $('#notKopyaPencere').classList.remove('hidden');
}
function nkKaynakTakvim() { return durum.takvimler.find(x => x.id === $('#nkKaynak').value) || null; }
function nkSecimSifirla() {
  const k = nkKaynakTakvim();
  nkSecim = new Set(k ? Object.keys(k.notlar || {}) : []);
}
function notKopyaCiz() {
  const k = nkKaynakTakvim();
  const notGoster = nkSecenek().not;
  $('#nkGruplar').classList.toggle('hidden', !notGoster);
  $('#nkListe').classList.toggle('hidden', !notGoster);
  if (!k || !notGoster) { $('#nkGruplar').innerHTML = ''; $('#nkListe').innerHTML = ''; return; }

  const anahtarlar = Object.keys(k.notlar || {}).sort().filter(a => notNesne(k.notlar[a]));
  if (!anahtarlar.length) {
    $('#nkGruplar').innerHTML = '';
    $('#nkListe').innerHTML = `<p class="text-soluk text-sm">${T('not_kopyala_yok')}</p>`;
    return;
  }
  const gruplar = [...new Set(anahtarlar.map(a => notNesne(k.notlar[a]).emoji || ''))];
  $('#nkGruplar').innerHTML = gruplar.map(e => {
    const ait = anahtarlar.filter(a => (notNesne(k.notlar[a]).emoji || '') === e);
    const tamam = ait.every(a => nkSecim.has(a));
    return `<button class="btn ${tamam ? 'btn-ana' : 'btn-yan'} text-xs" data-nkgrup="${e}">${e ? e : T('emoji_grup_bos')} (${ait.length})</button>`;
  }).join('') +
    `<button class="btn btn-sade text-xs" data-nkhepsi="1">${T('hepsini_sec')}</button>
     <button class="btn btn-sade text-xs" data-nkhepsi="0">${T('hicbirini_sec')}</button>`;

  $('#nkListe').innerHTML = anahtarlar.map(a => {
    const not = notNesne(k.notlar[a]);
    const p2 = a.split('-');
    const tarih = new Date(+p2[0], +p2[1] - 1, +p2[2]);
    return `<label class="flex items-center gap-2 border border-cizgi rounded-xl px-3 py-1.5 text-sm">
      <input type="checkbox" data-nknot="${a}" ${nkSecim.has(a) ? 'checked' : ''} class="w-4 h-4 accent-pembe">
      <span class="font-semibold w-24 shrink-0">${tarih.toLocaleDateString(yerelKod(), {day: '2-digit', month: 'short'})}</span>
      <span class="w-6 text-center">${not.emoji || ''}</span>
      <span class="flex-1 truncate">${kacan(not.metin)}</span></label>`;
  }).join('');

  $$('[data-nkgrup]', $('#nkGruplar')).forEach(b => b.onclick = () => {
    const e = b.dataset.nkgrup;
    const ait = anahtarlar.filter(a => (notNesne(k.notlar[a]).emoji || '') === e);
    const tamam = ait.every(a => nkSecim.has(a));
    ait.forEach(a => tamam ? nkSecim.delete(a) : nkSecim.add(a));
    notKopyaCiz();
  });
  $$('[data-nkhepsi]', $('#nkGruplar')).forEach(b => b.onclick = () => {
    nkSecim = b.dataset.nkhepsi === '1' ? new Set(anahtarlar) : new Set();
    notKopyaCiz();
  });
  $$('[data-nknot]', $('#nkListe')).forEach(i => i.onchange = () => {
    i.checked ? nkSecim.add(i.dataset.nknot) : nkSecim.delete(i.dataset.nknot);
    notKopyaCiz();
  });
}
async function notKopyaUygula() {
  const kaynak = nkKaynakTakvim(), hedef = nkHedefTakvim;
  if (!kaynak || !hedef) return;
  bekle(T('hazirlaniyor'));
  let fotoSayi = 0, notSayi = 0;
  const sec = nkSecenek();
  if (sec.foto) {
    hedef.fotograflar = hedef.fotograflar || {};
    for (const ay of hedef.aylar) {
      const kayit = (kaynak.fotograflar || {})[ay];
      if (!kayit) continue;
      const blob = await Depo.takvimFotoBlob(kaynak, kayit);
      if (!blob) continue;
      const eski = hedef.fotograflar[ay];
      if (eski) await Depo.takvimFotoSil(hedef, eski);
      hedef.fotograflar[ay] = await Depo.takvimFotoYaz(hedef, ay, new File([blob], (kayit.dosyaAdi || ay + '.jpg'), {type: blob.type || 'image/jpeg'}));
      fotoSayi++;
    }
  }
  if (sec.altnot) {
    hedef.altNotlar = hedef.altNotlar || {};
    for (const ay of hedef.aylar) {
      const not = (kaynak.altNotlar || {})[ay];
      if (not) hedef.altNotlar[ay] = not;
    }
  }
  if (sec.not) {
    hedef.notlar = hedef.notlar || {};
    nkSecim.forEach(a => {
      const not = notNesne(kaynak.notlar[a]);
      if (!not) return;
      const parca = a.split('-');
      hedef.notlar[`${hedef.yil}-${parca[1]}-${parca[2]}`] = not.ref ? {ref: not.ref} : {metin: not.metin, emoji: not.emoji};
      notSayi++;
    });
  }
  await takvimKaydet(hedef);
  bekleKapat();
  $('#notKopyaPencere').classList.add('hidden');
  takvimDetayCiz(); takvimListeCiz();
  bildir(T('kopya_tamam', {f: fotoSayi, n: notSayi}));
}

/* ---------- 12) DIŞA AKTARMA -------------------------------------------- */
const altYazi = (f) => [f.baslik, tarihMetin(f.tarih), f.yer].filter(Boolean).join('  ·  ');
/* Baskı kalitesi açıkken sayfalar 300 dpi'a yakın çözünürlükte üretilir */
const baskiAcik = () => !!(($('#baskiKalite') && $('#baskiKalite').checked) ||
                           ($('#baskiKaliteTakvim') && $('#baskiKaliteTakvim').checked));
const ciktiOlcek = () => baskiAcik() ? 3.5 : 2.4;
const ciktiKalite = () => baskiAcik() ? .96 : .9;
const fotoKenar = () => baskiAcik() ? 2400 : 1500;

async function pdfAktar() {
  const a = albumBul(); if (!a) return bildir(T('once_album'), 'hata');
  const fotolar = tumFotograflar(a);
  if (!fotolar.length) return bildir(T('foto_yok'), 'hata');
  try {
    bekle(T('pdf_hazirlaniyor', {i: 0, n: fotolar.length}));
    await kutuphaneGetir(KUTUPHANE.jspdf, 'jspdf');
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
    const G = 297, Y = 210;
    // galeri hissi: krem zemin, cömert kenar boşluğu, fotoğraf hakim, yazı sessiz
    const KREM = [250, 249, 247], MUREKKEP = '#2F2A35', SOLUK = '#9A93A3', CIZGI = [223, 219, 226];
    const kenar = 26, ustBosluk = 22, altBosluk = 34;

    const zemin = () => { pdf.setFillColor(...KREM); pdf.rect(0, 0, G, Y, 'F'); };
    const yaziKoy = (metin, ayar, x, y, genislik) => {
      const gorsel = yaziGorseli([metin], ayar);
      const yuks = genislik * gorsel.y / gorsel.g;
      pdf.addImage(gorsel.veri, 'PNG', x, y, genislik, yuks);
      return yuks;
    };

    // --- kapak ---
    zemin();
    pdf.setDrawColor(...CIZGI); pdf.setLineWidth(0.3);
    pdf.line(kenar, 34, G - kenar, 34);
    let imlec = 70;
    imlec += yaziKoy(a.ithaf || a.ad, {punto: a.ithaf ? 70 : 92, kalin: false, hiza: 'center', renk: MUREKKEP, serif: true},
                     kenar, imlec, G - kenar * 2) + 10;
    if (a.ithaf) imlec += yaziKoy(a.ad, {punto: 34, hiza: 'center', renk: SOLUK, serif: true}, kenar, imlec, G - kenar * 2) + 6;
    yaziKoy(`${fotolar.length} ${dil === 'tr' ? 'fotoğraf' : 'photographs'}  ·  ${kisaTarih(a.olusturuldu)}`,
            {punto: 26, hiza: 'center', renk: SOLUK, aralik: 1.2}, kenar, imlec + 4, G - kenar * 2);
    pdf.line(kenar, Y - 26, G - kenar, Y - 26);
    yaziKoy(MARKA_SITE, {punto: 22, hiza: 'center', renk: SOLUK}, kenar, Y - 22, G - kenar * 2);

    // --- fotoğraf sayfaları ---
    let i = 0;
    for (const x of fotolar) {
      const resim = await blobVeriAdresi(await Depo.fotoBlob(a, x.grup, x.foto), fotoKenar(), ciktiKalite());
      if (!resim) continue;
      i++; bekleMetin(T('pdf_hazirlaniyor', {i, n: fotolar.length})); bekleOran(i / fotolar.length * 100);
      pdf.addPage();
      zemin();

      const alanG = G - kenar * 2, alanY = Y - ustBosluk - altBosluk;
      const olcek = Math.min(alanG / resim.g, alanY / resim.y);
      const g = resim.g * olcek, y = resim.y * olcek;
      const px = (G - g) / 2, py = ustBosluk + (alanY - y) / 2;
      // fotoğrafın altında ince bir gölge yerine sade çerçeve çizgisi
      pdf.setDrawColor(...CIZGI); pdf.setLineWidth(0.2);
      pdf.rect(px - 0.6, py - 0.6, g + 1.2, y + 1.2);
      pdf.addImage(resim.veri, 'JPEG', px, py, g, y);

      // altyazı: başlık serif, altında tarih ve yer küçük harflerle
      const baslik = (x.foto.baslik || '').trim();
      const alt = [tarihMetin(x.foto.tarih), x.foto.yer].filter(Boolean).join('  ·  ');
      let ay = Y - altBosluk + 10;
      if (baslik) ay += yaziKoy(baslik, {punto: 30, hiza: 'center', renk: MUREKKEP, serif: true}, kenar, ay, alanG) + 2;
      if (alt) ay += yaziKoy(alt, {punto: 22, hiza: 'center', renk: SOLUK}, kenar, ay, alanG) + 2;
      if (x.foto.not) yaziKoy(x.foto.not, {punto: 22, hiza: 'center', renk: SOLUK, italik: true}, kenar, ay, alanG);

      // koşu başlığı ve sayfa numarası
      yaziKoy(a.ad, {punto: 16, renk: SOLUK}, kenar, Y - 12, 80);
      yaziKoy(String(i), {punto: 16, hiza: 'center', renk: SOLUK}, G - kenar - 20, Y - 12, 20);
    }

    // --- kapanış ---
    pdf.addPage();
    zemin();
    pdf.setDrawColor(...CIZGI); pdf.line(kenar, Y / 2 - 14, G - kenar, Y / 2 - 14);
    yaziKoy(a.ad, {punto: 36, hiza: 'center', renk: MUREKKEP, serif: true}, kenar, Y / 2 - 4, G - kenar * 2);
    yaziKoy(MARKA_SITE, {punto: 20, hiza: 'center', renk: SOLUK}, kenar, Y / 2 + 14, G - kenar * 2);

    const adDosya = temizAd(a.ad) + '.pdf';
    const blob = pdf.output('blob');
    indir(blob, adDosya);
    const klasore = await Depo.ciktiKaydet(adDosya, blob);
    bekleKapat(); bildir(T('pdf_indi')); izle('export_pdf', {print: baskiAcik()});
    if (klasore) bildir(T('exports_kaydedildi'), 'bilgi');
    paylasSor(blob, adDosya, 'application/pdf', {tur: 'album', id: a.id});
  } catch (e) { bekleKapat(); bildir(String(e.message || e), 'hata'); }
}

/* WhatsApp mp4 ister; destekleyen tarayıcıda mp4, yoksa webm kaydediyoruz */
function videoMime(sesli) {
  if (!window.MediaRecorder) return '';
  // Ses varken yalnızca ses kodeği tanımlı biçimleri kullanıyoruz;
  // "video/mp4" gibi kodeksiz seçenekler bazı tarayıcılarda müziği yazmıyor.
  const sesli_adaylar = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2',
                         'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus'];
  const sessiz_adaylar = ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4',
                          'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const dene = (liste) => liste.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } });
  if (sesli) return dene(sesli_adaylar) || dene(sessiz_adaylar) || '';
  return dene(sessiz_adaylar) || dene(sesli_adaylar) || '';
}


/* --- Paylaşım: dosyayı WhatsApp/mail/mesaj olarak doğrudan gönderme --- */
let sonCikti = null;
function paylasilabilir(blob, ad, tip) {
  try { return !!(navigator.canShare && navigator.canShare({files: [new File([blob], ad, {type: tip})]})); }
  catch { return false; }
}
function paylasSor(blob, ad, tip, kaynak) {
  sonCikti = {blob, ad, tip, kaynak: kaynak || null, url: null};
  const mb = blob.size / 1e6;
  const cokBuyuk = mb > PAYLASIM_SINIR_MB;
  const destek = !cokBuyuk && paylasilabilir(blob, ad, tip);
  $('#paylasDosya').textContent = T('paylas_hazir', {ad});
  $('#paylasNot').textContent = cokBuyuk
    ? T('paylasim_buyuk', {mb: mb.toFixed(1), limit: PAYLASIM_SINIR_MB})
    : (destek ? T('paylas_var') : T('paylas_yok'));
  $('#paylasGonder').classList.toggle('hidden', !destek);
  $('#paylasOniz').classList.toggle('hidden', !/pdf|video/.test(tip));
  $('#paylasDosyaAdi').textContent = T('indirme_yeri', {ad});
  $('#paylasYer').textContent = T('indirme_tarayici') +
    (Depo.klasorAktif() ? ' ' + T('indirme_klasor', {yol: Depo.kokAd}) : '');
  $('#paylasPencere').classList.remove('hidden');
}
/* Dosyayla birlikte uygulamanın bağlantısını ayrı bir mesaj olarak paylaşır */
async function linkPaylas(zincir) {
  const veri = {
    title: T('link_baslik', {marka: MARKA}),
    text: T('link_metin', {marka: MARKA}),
    url: 'https://' + MARKA_SITE
  };
  if (navigator.share) {
    try {
      await navigator.share(veri);
      izle('share_link');
      $('#paylasPencere').classList.add('hidden');
      return;
    } catch (e) {
      // zincirli çağrıda tarayıcı izin vermemiş olabilir; çağıran tarafa haber ver
      if (zincir) throw e;
      return;
    }
  }
  try {
    await navigator.clipboard.writeText(veri.text + ' https://' + MARKA_SITE);
    bildir(T('link_kopyalandi'));
    izle('share_link', {kopya: true});
  } catch (e) { if (zincir) throw e; }
}

async function ciktiPaylas() {
  if (!sonCikti) return;
  const dosya = new File([sonCikti.blob], sonCikti.ad, {type: sonCikti.tip});
  try {
    // dosya adı sohbette metin olarak görünmesin diye başlık göndermiyoruz
    await navigator.share({files: [dosya]});
    izle('share', {type: sonCikti.tip});
  } catch (e) { return bildir(T('paylas_iptal'), 'bilgi'); }

  // dosya gittikten hemen sonra bağlantıyı ikinci bir mesaj olarak göndermeyi dene
  $('#ciktiOnizPencere').classList.add('hidden');
  $('#paylasPencere').classList.remove('hidden');
  try {
    await new Promise(r => setTimeout(r, 350));
    await linkPaylas(true);
  } catch (e) {
    // tarayıcı arka arkaya iki paylaşıma izin vermedi: düğmeyi öne çıkar
    $('#paylasLink').classList.add('btn-ana');
    $('#paylasLink').classList.remove('btn-yan');
    bildir(T('link_gonderilemedi'), 'bilgi');
  }
}

/* --- Video: gösteriyi sekme kaydıyla, sesiyle birlikte kaydeder --- */
let kayitDurum = null;

async function ekranKaydiBaslat() {
  const secim = $('#onizlemeAlbum').value;
  if (secim) durum.seciliAlbum = secim;
  const a = albumBul();
  if (!a) return bildir(T('once_album'), 'hata');
  if (!tumFotograflar(a).length) return bildir(T('foto_yok'), 'hata');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) {
    return bildir(T('ekran_desteksiz'), 'hata');
  }
  if (!confirm(T('ekran_onay'))) return;

  let akis;
  try {
    akis = await navigator.mediaDevices.getDisplayMedia({
      video: {frameRate: 30},
      audio: true,
      preferCurrentTab: true,
      selfBrowserSurface: 'include',
      systemAudio: 'include'
    });
  } catch (e) { return bildir(T('ekran_iptal'), 'bilgi'); }

  const sesVar = akis.getAudioTracks().length > 0;
  if (!sesVar) bildir(T('ekran_sessiz'), 'bilgi');
  const mime = videoMime(sesVar);
  if (!mime) { akis.getTracks().forEach(t => t.stop()); return bildir(T('video_desteksiz'), 'hata'); }

  let kayitci;
  try {
    kayitci = new MediaRecorder(akis, {mimeType: mime, videoBitsPerSecond: 6000000, audioBitsPerSecond: 128000});
  } catch (e) {
    akis.getTracks().forEach(t => t.stop());
    return bildir(T('video_desteksiz'), 'hata');
  }
  const parcalar = [];
  kayitci.ondataavailable = (e) => { if (e.data.size) parcalar.push(e.data); };
  kayitDurum = {kayitci, akis, parcalar, mime, album: a, bitti: false};

  // kullanıcı tarayıcının "paylaşımı durdur" düğmesine basarsa kaydı düzgün kapat
  akis.getVideoTracks().forEach(t => t.addEventListener('ended', () => ekranKaydiBitir()));

  kayitci.start(1000);
  izle('video_record_start');
  const sure = Math.max(0.5, Math.min(10, parseFloat($('#videoSure').value) || 3));
  await gosteriBaslat({kayit: true, sure});
}

async function ekranKaydiBitir() {
  if (!kayitDurum || kayitDurum.bitti) return;
  kayitDurum.bitti = true;
  const {kayitci, akis, parcalar, mime, album} = kayitDurum;
  bekle(T('hazirlaniyor'));
  try {
    if (kayitci.state !== 'inactive') {
      const durdu = new Promise(r => kayitci.onstop = r);
      kayitci.stop();
      await durdu;
    }
  } catch (e) {}
  akis.getTracks().forEach(t => t.stop());
  kayitDurum = null;
  gosteriKapat();

  const blob = new Blob(parcalar, {type: mime.split(';')[0]});
  if (!blob.size) { bekleKapat(); return bildir(T('ekran_iptal'), 'bilgi'); }
  const adDosya = temizAd(album.ad) + (mime.indexOf('mp4') >= 0 ? '.mp4' : '.webm');
  indir(blob, adDosya);
  const klasore = await Depo.ciktiKaydet(adDosya, blob);
  bekleKapat();
  bildir(T('video_indi')); izle('export_video', {size: blob.size});
  if (klasore) bildir(T('exports_kaydedildi'), 'bilgi');
  paylasSor(blob, adDosya, mime.split(';')[0], {tur: 'album', id: album.id});
}

async function yedekAl() {
  if (!durum.albumler.length) return bildir(T('yedek_yok'), 'hata');
  const medyaDahil = Depo.klasorAktif() ? confirm(T('yedek_tam_soru')) : true;
  try {
    bekle(T('yedek_hazirlaniyor'));
    await kutuphaneGetir(KUTUPHANE.jszip, 'JSZip');
    const zip = new JSZip(), medyaListe = [];
    if (medyaDahil) {
      const hepsi = [];
      durum.albumler.forEach(a => tumFotograflar(a).forEach(x => hepsi.push({a, x})));
      let i = 0;
      for (const {a, x} of hepsi) {
        i++; bekleMetin(T('yedek_paketleniyor', {i, n: hepsi.length})); bekleOran(i / hepsi.length * 100);
        const blob = await Depo.fotoBlob(a, x.grup, x.foto);
        if (!blob) continue;
        const yol = `${a.klasor || slug(a.ad)}/${x.foto.klasor || 'foto'}/${x.foto.dosyaAdi || (x.foto.id + '.jpg')}`;
        zip.file('medya/' + yol, blob);
        medyaListe.push({yol, fotoId: x.foto.id, tip: blob.type || 'image/jpeg', boyut: blob.size});
      }
      for (const t of durum.takvimler) {
        for (const ay of Object.keys(t.fotograflar || {})) {
          const blob = await Depo.takvimFotoBlob(t, t.fotograflar[ay]);
          if (!blob) continue;
          const yol = `takvim/${t.klasor || slug(t.ad)}/${t.fotograflar[ay].dosyaAdi || (ay + '.jpg')}`;
          zip.file('medya/' + yol, blob);
          medyaListe.push({yol, takvimId: t.id, ay: +ay, tip: blob.type || 'image/jpeg', boyut: blob.size});
        }
      }
      for (const a of durum.albumler) {
        if (!a.muzik || a.muzik.dis) continue;
        const adres = await Depo.muzikAdres(a);
        if (!adres) continue;
        try {
          const blob = await (await fetch(adres)).blob();
          const yol = `${a.klasor || slug(a.ad)}/${a.muzik.dosyaAdi || 'music.mp3'}`;
          zip.file('medya/' + yol, blob);
          medyaListe.push({yol, muzikAlbum: a.id, tip: blob.type, boyut: blob.size});
        } catch (e) {}
      }
    }
    zip.file('manifest.json', JSON.stringify({
      uygulama: 'berenk', surum: 5, tarih: Date.now(), medyaDahil,
      defterAdi: $('#defterAdi').textContent, dil,
      albumler: durum.albumler, takvimler: durum.takvimler, medya: medyaListe
    }, null, 2));
    zip.file(dil === 'tr' ? 'OKUBENI.txt' : 'READ-ME.txt', T('okubeni'));
    const blob = await zip.generateAsync({type: 'blob', compression: 'DEFLATE', compressionOptions: {level: 3}});
    indir(blob, `berenk-${new Date().toISOString().slice(0, 10)}.album`);
    await ayarYaz('sonYedek', Date.now());
    bekleKapat(); yedekHatirlat();
    bildir(T('yedek_indi')); izle('backup_created', {photos: medyaDahil});
  } catch (e) { bekleKapat(); bildir(String(e.message || e), 'hata'); }
}
async function yedekYukle() {
  const [dosya] = await dosyaSec('.album,.zip,application/zip', false);
  if (!dosya) return;
  if (!confirm(T('yedek_onay'))) return;
  try {
    bekle(T('yedek_okunuyor'));
    await kutuphaneGetir(KUTUPHANE.jszip, 'JSZip');
    const zip = await JSZip.loadAsync(dosya);
    const bilgiDosya = zip.file('manifest.json');
    if (!bilgiDosya) throw new Error(T('yedek_gecersiz'));
    const bilgi = JSON.parse(await bilgiDosya.async('string'));
    const albumler = bilgi.albumler || [];
    for (const a of albumler) {
      a.klasorEski = a.klasor || slug(a.ad);
      if (Depo.klasorAktif()) {
        a.klasor = await Depo.benzersizKlasor(Depo.kok, a.klasor || slug(a.ad));
        await Depo.kok.getDirectoryHandle(a.klasor, {create: true});
        albumuDuzlestir(a);
      }
    }
    const takvimler = bilgi.takvimler || [];
    for (const t of takvimler) {
      if (Depo.klasorAktif()) {
        const kok = await Depo.takvimKok(true);
        t.klasor = await Depo.benzersizKlasor(kok, t.klasor || slug(t.ad));
        await kok.getDirectoryHandle(t.klasor, {create: true});
      }
    }
    let i = 0;
    for (const m of (bilgi.medya || [])) {
      const girdi = zip.file('medya/' + m.yol);
      if (!girdi) continue;
      i++; bekleMetin(T('yedek_paketleniyor', {i, n: bilgi.medya.length}));
      const blob = await girdi.async('blob');
      const parca = m.yol.split('/');
      const albumKlasor = parca[0], dosyaAdi = parca[parca.length - 1];
      if (parca[0] === 'takvim' || m.takvimId) {
        const t = takvimler.find(z => z.id === m.takvimId);
        if (!t) continue;
        t.fotograflar = t.fotograflar || {};
        t.fotograflar[m.ay] = await Depo.takvimFotoYaz(t, m.ay, new File([blob], dosyaAdi, {type: m.tip}));
        continue;
      }
      const a = albumler.find(z => z.klasorEski === albumKlasor) || albumler.find(z => z.klasor === albumKlasor) || albumler[0];
      if (!a) continue;
      if (m.muzikAlbum || parca.length === 2) {
        const eskiAd = a.muzik && a.muzik.ad;
        a.muzik = await Depo.muzikYaz(a, new File([blob], dosyaAdi, {type: m.tip}));
        if (eskiAd) a.muzik.ad = eskiAd;
        continue;
      }
      albumuDuzlestir(a);
      const f = albumFotograflari(a).find(z => z.id === m.fotoId);
      if (!f) continue;
      Object.assign(f, await Depo.fotoYaz(a, {klasor: ''}, new File([blob], dosyaAdi, {type: m.tip})));
    }
    for (const a of albumler) {
      delete a.klasorEski;
      const j = durum.albumler.findIndex(x => x.id === a.id);
      if (j >= 0) durum.albumler[j] = a; else durum.albumler.push(a);
      await Depo.albumYaz(a);
    }
    for (const t of takvimler) {
      const j = durum.takvimler.findIndex(x => x.id === t.id);
      if (j >= 0) durum.takvimler[j] = t; else durum.takvimler.push(t);
      await Depo.takvimYaz(t);
    }
    durum.albumler.sort((a, b) => a.olusturuldu - b.olusturuldu);
    if (!albumBul() && durum.albumler[0]) durum.seciliAlbum = durum.albumler[0].id;
    bekleKapat();
    durum.ekran = 'liste'; durum.takvimEkran = 'liste';
    ekranGoster(); takvimEkranGoster(); listeCiz(); onizlemeCiz();
    takvimListeCiz(); takvimSecimCiz();
    bildir(T('yedek_geri'));
  } catch (e) { bekleKapat(); bildir(String(e.message || e), 'hata'); }
}

let sb = null, oturum = null, profil = null;
const bulutAcik = () => !!(BULUT.url && BULUT.anonKey);
/* Kurulum sırasında nerede takılındığını gösterir */
function bulutTanilama() {
  if (!window.BERENK_CONFIG) return T('tanilama_yok');
  const eksik = [];
  if (!BULUT.url) eksik.push('url');
  if (!BULUT.anonKey) eksik.push('anonKey');
  if (eksik.length) return T('tanilama_bos', {alan: eksik.join(' + ')});
  return T('tanilama_tamam');
}
const adminMi = () => !!(profil && profil.is_admin);

async function bulutBaslat() {
  if (!bulutAcik()) return;
  try {
    await kutuphaneGetir(SUPABASE_CDN, 'supabase');
    sb = window.supabase.createClient(BULUT.url, BULUT.anonKey);
    const {data} = await sb.auth.getSession();
    await oturumGuncelle(data ? data.session : null);
    sb.auth.onAuthStateChange((_olay, s2) => oturumGuncelle(s2));
  } catch (e) { console.warn('Bulut bağlanamadı', e); }
}
async function oturumGuncelle(yeni) {
  oturum = yeni || null;
  profil = null;
  if (oturum) {
    try {
      const {data} = await sb.from('profiles').select('*').eq('id', oturum.user.id).maybeSingle();
      profil = data || null;
      if (!profil) {
        await sb.from('profiles').insert({id: oturum.user.id, email: oturum.user.email,
          country: cihazUlkesi(), lang: dil, consent_at: new Date().toISOString()});
        const {data: d2} = await sb.from('profiles').select('*').eq('id', oturum.user.id).maybeSingle();
        profil = d2 || null;
      }
      kullanimGonder();
      const cihaz = cihazKimligi();
      if (cihaz) { try { await sb.rpc('claim_device', {p_device: cihaz}); } catch (e) {} }
    } catch (e) {}
  }
  menuCiz(); kotaUygula(); girisKapakGuncelle(); ustHesapCiz();
}

/* --- etkinlik takibi --- */
const analitikAcik = () => localStorage.getItem('cerezOnay') === 'kabul';
/* Hesapsız kullananları ayırt etmek için tarayıcıya rastgele bir cihaz kimliği yazılır.
   Kişiyi değil cihaz+tarayıcıyı temsil eder ve yalnızca çerez onayı verilirse üretilir. */
function cihazKimligi() {
  if (!analitikAcik()) return null;
  let k = null;
  try {
    k = localStorage.getItem('cihazKimlik');
    if (!k) {
      k = (crypto && crypto.randomUUID) ? crypto.randomUUID() : (kimlik() + kimlik());
      localStorage.setItem('cihazKimlik', k);
    }
  } catch (e) { return null; }
  return k;
}
async function izle(olay, detay) {
  try {
    if (window.gtag) window.gtag('event', olay, detay || {});
    if (!sb || !analitikAcik()) return;
    await sb.from('activities').insert({
      user_id: oturum ? oturum.user.id : null,
      device_id: cihazKimligi(),
      event: olay, meta: detay || {}, lang: dil, country: (profil && profil.country) || cihazUlkesi()
    });
  } catch (e) {}
}
function gaYukle() {
  if (!BULUT.gaOlcumId || !analitikAcik() || window.gtag) return;
  const s1 = document.createElement('script');
  s1.async = true; s1.src = 'https://www.googletagmanager.com/gtag/js?id=' + BULUT.gaOlcumId;
  document.head.appendChild(s1);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', BULUT.gaOlcumId);
}

/* --- kullanım ve kota --- */
function yerelKullanim() {
  const albumBayt = durum.albumler.reduce((t, a) => t + albumBoyut(a), 0);
  const takvimBayt = durum.takvimler.reduce((t, tk) =>
    t + Object.values(tk.fotograflar || {}).reduce((x, f) => x + (f.boyut || 0), 0), 0);
  const foto = durum.albumler.reduce((t, a) => t + tumFotograflar(a).length, 0) +
               durum.takvimler.reduce((t, tk) => t + Object.keys(tk.fotograflar || {}).length, 0);
  return {mb: Math.round((albumBayt + takvimBayt) / 1e6), foto};
}
function kotaUygula() { /* dışa aktarma serbest; sınır yalnızca paylaşım anında uygulanır */ }
function ustHesapCiz() {
  const goster = !oturum;            // bulut kapalıysa düğme durumu açıklar
  $('#ustGiris').classList.toggle('hidden', !goster);
  $('#ustKayit').classList.toggle('hidden', !goster);
  const hesap = $('#ustHesap');
  hesap.classList.toggle('hidden', !(bulutAcik() && oturum));
  if (oturum) hesap.textContent = '👤 ' + oturum.user.email;
}
function girisKapakGuncelle() {
  const kapak = $('#girisKapak');
  if (!kapak) return;
  kapak.classList.toggle('hidden', !(bulutAcik() && GIRIS_ZORUNLU && !oturum));
}
let kullanimZaman = null;
function kullanimGonder() {
  if (!sb || !oturum) return;
  clearTimeout(kullanimZaman);
  kullanimZaman = setTimeout(async () => {
    const k = yerelKullanim();
    try {
      await sb.from('profiles').update({
        usage_mb: k.mb, usage_photos: k.foto,
        albums: durum.albumler.length, calendars: durum.takvimler.length,
        last_seen: new Date().toISOString()
      }).eq('id', oturum.user.id);
    } catch (e) {}
    kotaUygula();
  }, 1500);
}

/* --- üyelik pencereleri --- */
let authMod = 'giris';
function authAc(mod) {
  if (!bulutAcik()) return bildir(T('bulut_kapali'), 'bilgi');
  authMod = mod || 'giris';
  $('#authHata').classList.add('hidden');
  $('#authUlke').innerHTML = ULKELER.map(k => `<option value="${k}" ${k === cihazUlkesi() ? 'selected' : ''}>${kacan(ulkeAdi(k))}</option>`).join('');
  $('#authDil').value = dil;
  authCiz();
  $('#authPencere').classList.remove('hidden');
}
function authCiz() {
  const kayit = authMod === 'kayit';
  $('#authBaslik').textContent = T(kayit ? 'kayit_ol' : 'giris_yap');
  $('#authGonder').textContent = T(kayit ? 'kayit_ol' : 'giris_yap');
  $('#authGecis').textContent = T(kayit ? 'hesap_var' : 'hesap_yok');
  $('#authKayitAlan').classList.toggle('hidden', !kayit);
  $('#authSifre2Alan').classList.toggle('hidden', !kayit);
  $('#authSifre').autocomplete = kayit ? 'new-password' : 'current-password';
  $('#authGoz').title = T('sifre_goster');
}
function sifreGoster() {
  const gizli = $('#authSifre').type === 'password';
  $('#authSifre').type = gizli ? 'text' : 'password';
  $('#authSifre2').type = gizli ? 'text' : 'password';
  $('#authGoz').textContent = gizli ? '🙈' : '👁️';
}
function authHata(metin) {
  const el = $('#authHata');
  el.textContent = metin; el.classList.remove('hidden');
}
async function authGonder() {
  const eposta = $('#authEposta').value.trim(), sifre = $('#authSifre').value;
  if (!eposta || !sifre) return authHata(T('eposta_gerekli'));
  if (sifre.length < 6) return authHata(T('sifre_min'));
  if (authMod === 'kayit' && sifre !== $('#authSifre2').value) return authHata(T('sifre_uyusmuyor'));
  bekle(T(authMod === 'kayit' ? 'kayit_yapiliyor' : 'giris_yapiliyor'));
  const zamanAsimi = (istek) => Promise.race([
    istek,
    new Promise((_, red) => setTimeout(() => red(new Error(T('sunucu_yanit_yok'))), 25000))
  ]);
  try {
    if (authMod === 'kayit') {
      if (!$('#authYas').checked) { bekleKapat(); return authHata(T('yas_gerekli')); }
      if (!$('#authSozlesme').checked) { bekleKapat(); return authHata(T('sozlesme_gerekli')); }
      const {error} = await zamanAsimi(sb.auth.signUp({
        email: eposta, password: sifre,
        options: {data: {country: $('#authUlke').value, lang: $('#authDil').value, consent: true, adult: true},
                  emailRedirectTo: location.origin + location.pathname}
      }));
      if (error) throw error;
      bekleKapat();
      $('#authPencere').classList.add('hidden');
      bildir(T('kayit_basarili'));
      alert(T('onay_bekliyor'));
      izle('signup', {country: $('#authUlke').value});
    } else {
      const {error} = await zamanAsimi(sb.auth.signInWithPassword({email: eposta, password: sifre}));
      if (error) throw error;
      bekleKapat();
      $('#authPencere').classList.add('hidden');
      bildir(T('giris_basarili'));
      izle('login');
    }
  } catch (e) {
    bekleKapat();
    const mesaj = String((e && e.message) || '');
    authHata(/504|timeout|Failed to fetch|NetworkError/i.test(mesaj)
      ? T('sunucu_yanit_yok') + ' (' + mesaj.slice(0, 60) + ')'
      : (mesaj || T(authMod === 'kayit' ? 'kayit_hata' : 'giris_hata')));
  }
}
async function sifreSifirla() {
  const eposta = $('#authEposta').value.trim();
  if (!eposta) return authHata(T('eposta_gerekli'));
  try {
    await sb.auth.resetPasswordForEmail(eposta, {redirectTo: location.href});
    bildir(T('sifre_maili'));
  } catch (e) { authHata(e.message || ''); }
}
async function cikisYap() {
  if (sb) await sb.auth.signOut();
  oturum = null; profil = null;
  menuCiz(); kotaUygula();
}

/* Tüm veriyi Excel'de açılabilir CSV olarak indirir (tarih sınırı yok) */
async function veriIndir(tablo) {
  if (!sb) return;
  bekle(T('veri_indiriliyor'));
  try {
    let hepsi = [], ofset = 0;
    while (true) {
      const {data, error} = await sb.from(tablo).select('*').order('id', {ascending: true}).range(ofset, ofset + 999);
      if (error) throw error;
      if (!data || !data.length) break;
      hepsi = hepsi.concat(data);
      bekleMetin(T('veri_indiriliyor') + ' ' + hepsi.length);
      if (data.length < 1000) break;
      ofset += 1000;
    }
    if (!hepsi.length) { bekleKapat(); return bildir('—', 'bilgi'); }
    const sutunlar = [...new Set(hepsi.flatMap(satir => Object.keys(satir)))];
    const kacir = (deger) => {
      if (deger === null || deger === undefined) return '';
      const metin = typeof deger === 'object' ? JSON.stringify(deger) : String(deger);
      return '"' + metin.split('"').join('""') + '"';
    };
    const satirlar = [sutunlar.join(';')].concat(hepsi.map(satir => sutunlar.map(s2 => kacir(satir[s2])).join(';')));
    const blob = new Blob(['\uFEFF' + satirlar.join('\r\n')], {type: 'text/csv;charset=utf-8'});
    indir(blob, `${tablo}-${new Date().toISOString().slice(0, 10)}.csv`);
    bekleKapat();
  } catch (e) { bekleKapat(); bildir(String(e.message || e), 'hata'); }
}

  if (!kutu) return;
  const liste = durum.muzikListesi || [];
  kutu.innerHTML = liste.length
    ? liste.map((m, i) => `<div class="flex items-center gap-2 text-sm border border-cizgi rounded-xl px-3 py-1.5">
        <span class="flex-1 truncate">🎵 ${kacan(m.title || m.file)}</span>
        <button class="btn btn-sade text-pembe" data-ghsil="${i}">${T('gh_sil')}</button></div>`).join('')
    : `<p class="text-xs text-soluk">${T('kutuphane_yok')}</p>`;
  $$('[data-ghsil]', kutu).forEach(b => b.onclick = () => ghParcaSil(+b.dataset.ghsil));
}

async function ghIstek(yol, secenek = {}) {
  const ay = ghAyar();
  const cevap = await fetch(`https://api.github.com/repos/${ay.depo}/contents/${yol}`, Object.assign({
    headers: {Authorization: 'Bearer ' + ay.token, Accept: 'application/vnd.github+json'}
  }, secenek));
  if (!cevap.ok && cevap.status !== 404) throw new Error(cevap.status + ' ' + (await cevap.text()).slice(0, 120));
  return cevap;
}
const base64Yap = (blob) => new Promise((cozum, hata) => {
  const okuyucu = new FileReader();
  okuyucu.onload = () => cozum(String(okuyucu.result).split(',')[1]);
  okuyucu.onerror = hata;
  okuyucu.readAsDataURL(blob);
});

async function ghIslem(is) {
  if (is === 'ayar') {
    const yeni = {depo: $('#ghDepo').value.trim(), dal: $('#ghDal').value.trim() || 'main', token: $('#ghToken').value.trim()};
    if (!yeni.depo || !yeni.token) return bildir(T('gh_eksik'), 'hata');
    localStorage.setItem('ghAyar', JSON.stringify(yeni));
    return bildir(T('gh_ayar_ok'));
  }
  if (is === 'dosya') {
    const [d] = await dosyaSec('audio/*', false);
    if (!d) return;
    ghDosya = d;
    $('#ghDosyaAdi').textContent = d.name;
    if (!$('#ghAd').value) $('#ghAd').value = d.name.replace(/[.][^.]+$/, '');
    return;
  }
  if (is === 'yukle') return ghYukle();
}

async function ghYukle() {
  const ay = ghAyar();
  if (!ay.depo || !ay.token) return bildir(T('gh_eksik'), 'hata');
  if (!ghDosya) return bildir(T('gh_dosya_yok'), 'hata');
  const ad = $('#ghAd').value.trim() || ghDosya.name;
  const dosyaAdi = slug(ghDosya.name.replace(/[.][^.]+$/, '')).toLowerCase() + '.' +
                   (ghDosya.name.split('.').pop() || 'mp3').toLowerCase();
  bekle(T('gh_yukleniyor'));
  try {
    const icerik = await base64Yap(ghDosya);
    await ghIstek(`music/${dosyaAdi}`, {
      method: 'PUT',
      body: JSON.stringify({message: `müzik: ${dosyaAdi}`, content: icerik, branch: ay.dal})
    });

    // list.json'u oku, ekle, geri yaz
    const mevcut = await ghIstek('music/list.json');
    let liste = [], sha = null;
    if (mevcut.status !== 404) {
      const veri = await mevcut.json();
      sha = veri.sha;
      try { liste = JSON.parse(decodeURIComponent(escape(atob(veri.content.replace(/\s+/g, ''))))); } catch { liste = []; }
      if (!Array.isArray(liste)) liste = liste.tracks || [];
    }
    liste = liste.filter(m => m.file !== dosyaAdi);
    liste.push({file: dosyaAdi, title: ad});
    const yeniIcerik = btoa(unescape(encodeURIComponent(JSON.stringify(liste, null, 2))));
    await ghIstek('music/list.json', {
      method: 'PUT',
      body: JSON.stringify(Object.assign({message: 'müzik listesi güncellendi', content: yeniIcerik, branch: ay.dal}, sha ? {sha} : {}))
    });

    durum.muzikListesi = liste;
    ghDosya = null;
    bekleKapat();
    ghBolumCiz(); muzikKutuphaneCiz();
    bildir(T('gh_yuklendi', {ad}));
  } catch (e) {
    bekleKapat();
    bildir(T('gh_hata', {mesaj: String(e.message || e).slice(0, 80)}), 'hata');
  }
}

async function ghParcaSil(indeks) {
  const liste = durum.muzikListesi || [];
  const m = liste[indeks];
  if (!m) return;
  if (!confirm(T('toplu_sil_onay', {n: 1}))) return;
  bekle(T('gh_yukleniyor'));
  try {
    const ay = ghAyar();
    const dosya = await ghIstek(`music/${m.file}`);
    if (dosya.status !== 404) {
      const veri = await dosya.json();
      await ghIstek(`music/${m.file}`, {
        method: 'DELETE',
        body: JSON.stringify({message: `müzik silindi: ${m.file}`, sha: veri.sha, branch: ay.dal})
      });
    }
    const mevcut = await ghIstek('music/list.json');
    if (mevcut.status !== 404) {
      const veri = await mevcut.json();
      const yeni = liste.filter((_, i) => i !== indeks);
      await ghIstek('music/list.json', {
        method: 'PUT',
        body: JSON.stringify({message: 'müzik listesi güncellendi', sha: veri.sha, branch: ay.dal,
                              content: btoa(unescape(encodeURIComponent(JSON.stringify(yeni, null, 2))))})
      });
      durum.muzikListesi = yeni;
    }
    bekleKapat();
    ghBolumCiz(); muzikKutuphaneCiz();
    bildir(T('gh_silindi', {ad: m.title || m.file}));
  } catch (e) {
    bekleKapat();
    bildir(T('gh_hata', {mesaj: String(e.message || e).slice(0, 80)}), 'hata');
  }
}

/* Arayüz metinleri sözlükten geliyor; bir hata olsa bile ekran boş kalmasın diye
   önce yalnızca metinleri yerleştiriyoruz. */
function metinleriDoldur() {
  try {
    document.documentElement.lang = dil;
    $$('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  } catch (e) { console.error(e); }
}
function hataGoster(mesaj) {
  const el = document.getElementById('hataSerit');
  if (!el) return;
  document.getElementById('hataMetin').textContent = String(mesaj).slice(0, 300);
  el.classList.remove('hidden');
}
window.addEventListener('error', (e) => hataGoster((e.message || 'hata') + ' — ' + (e.filename || '').split('/').pop() + ':' + e.lineno));
window.addEventListener('unhandledrejection', (e) => hataGoster('Söz reddedildi: ' + ((e.reason && e.reason.message) || e.reason)));

metinleriDoldur();
baslat().catch(e => {
  console.error(e);
  metinleriDoldur();
  hataGoster('Başlangıç hatası: ' + (e.message || e));
});
