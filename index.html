<script>
  tailwind.config = { theme: { extend: {
    colors: { kagit:'#F6F6F7', murekkep:'#2F2A35', soluk:'#7A7480', cizgi:'#E7E4EA',

    fontFamily: { baslik:['"Baloo 2"','system-ui','sans-serif'], metin:['Nunito','system-ui','sans-serif'] },

</script>
<style>
  :root { color-scheme: light; }
  body { font-family: Nunito, system-ui, sans-serif; background:#F6F6F7; color:#2F2A35; }
  h1,h2,h3,h4,.font-baslik { font-family:"Baloo 2", system-ui, sans-serif; }

  .btn { display:inline-flex; align-items:center; gap:.4rem; border-radius:999px; padding:.5rem .95rem;
         font-weight:700; font-size:.9rem; transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
  .btn:active { transform:translateY(1px) scale(.99); }
  .btn-ana  { background:#E0699A; color:#fff; }  .btn-ana:hover  { background:#D3568A; }
  .btn-grup { background:#8B7BD8; color:#fff; }  .btn-grup:hover { background:#7A69CE; }
  .btn-foto { background:#2FA98A; color:#fff; }  .btn-foto:hover { background:#28977B; }
  .btn-yan  { background:#fff; color:#2F2A35; border:1.5px solid #E7E4EA; } .btn-yan:hover { border-color:#CFCAD6; }
  .btn-sade { background:transparent; color:#7A7480; padding:.35rem .6rem; } .btn-sade:hover { background:rgba(47,42,53,.06); color:#2F2A35; }
  .btn:disabled { opacity:.4; pointer-events:none; }

  .alan { width:100%; border:1.5px solid #E7E4EA; background:#fff; border-radius:14px;
          padding:.6rem .8rem; font-size:.95rem; color:#2F2A35; }
  .alan:focus { outline:none; border-color:#8B7BD8; box-shadow:0 0 0 4px rgba(139,123,216,.14); }
  .alan::placeholder { font-style:italic; color:#B3AEBB; opacity:1; }
  input[type="date"].alan { -webkit-appearance:none; appearance:none; display:block;
                            width:100%!important; min-width:100%; max-width:100%; box-sizing:border-box; }
  input[type="date"]::-webkit-date-and-time-value { text-align:left; }
  input[type="date"]::-webkit-calendar-picker-indicator { margin-left:auto; }
  .kapatX { width:38px; height:38px; border-radius:999px; background:#F1EEF4; color:#2F2A35;
            font-size:18px; font-weight:700; display:grid; place-items:center; flex:none; }
  .kapatX:hover { background:#E2445C; color:#fff; }
  :focus-visible { outline:3px solid #8B7BD8; outline-offset:2px; border-radius:12px; }

  .sekme { border-radius:999px; padding:.55rem 1.1rem; font-weight:700; font-size:.95rem; color:#7A7480; }
  .sekme[aria-selected="true"] { background:#2F2A35; color:#fff; }

  /* Fotoğraf kutuları: kırpma yok, oran korunur */
  .kare { background:#fff; padding:8px 8px 26px; border-radius:10px; box-shadow:0 1px 4px rgba(47,42,53,.10);
          cursor:pointer; position:relative; }
  .kare img { width:100%; aspect-ratio:4/3; object-fit:contain; border-radius:6px; background:#EFEDF1; display:block; }
  .kare:hover { box-shadow:0 8px 20px rgba(47,42,53,.14); }
  .surukleniyor { opacity:.35; }
  .kare .silx { position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:999px;
                background:#E23E57; color:#fff; font-size:14px; font-weight:700; line-height:1;
                display:grid; place-items:center; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .cip { border-radius:999px; padding:.35rem .8rem; font-size:.8rem; font-weight:700;
         background:#fff; border:1.5px solid #E7E4EA; color:#2F2A35; }
  .cip.aktif { background:#2F2A35; color:#fff; border-color:#2F2A35; }
  .kare .sira { position:absolute; top:14px; left:14px; background:rgba(47,42,53,.72); color:#fff;
                font-size:.7rem; font-weight:700; border-radius:999px; padding:1px 7px; }

  #gosteri .slayt { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0;
                    transition:opacity .8s ease, transform .8s ease; will-change:opacity,transform; }
  #gosteri .slayt.t-slide { transform:translateX(7%); }
  #gosteri .slayt.t-zoom  { transform:scale(1.10); }
  #gosteri .slayt.iceri { opacity:1; transform:none; }
  #gosteri .slayt.iceri.t-zoom { animation:kaydir var(--sure,6s) ease-out forwards; }
  #gosteri .slayt.disari { opacity:0; }
  @keyframes kaydir { from{transform:scale(1.02)} to{transform:scale(1.13)} }
  #gosteriKontrol, #gosteriUst { transition:opacity .3s ease; }
  #gosteri.sakin #gosteriKontrol, #gosteri.sakin #gosteriUst { opacity:0; pointer-events:none; }
  #kayitRozet.parla { animation:parla 1.2s ease; }
  @keyframes parla { 0%{background:#D9F2E9; color:#1B7A62} 100%{background:transparent; color:#7A7480} }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#DDD9E2; border-radius:999px; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; } }
</style>
</head>

<div id="gosteri" class="hidden fixed inset-0 z-50 bg-black select-none">

const VT = (() => {
  let db = null;
  function ac() {
    return new Promise((cozum, hata) => {
      const istek = indexedDB.open('AniDefteriDB', 2);
      istek.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('albumler')) d.createObjectStore('albumler', {keyPath:'id'});
        if (!d.objectStoreNames.contains('medya'))    d.createObjectStore('medya',    {keyPath:'id'});
        if (!d.objectStoreNames.contains('gunluk'))   d.createObjectStore('gunluk',   {keyPath:'id'});
        if (!d.objectStoreNames.contains('ayar'))     d.createObjectStore('ayar',     {keyPath:'k'});
        if (!d.objectStoreNames.contains('takvimler')) d.createObjectStore('takvimler', {keyPath:'id'});
      };
      istek.onsuccess = () => { db = istek.result; cozum(db); };
      istek.onerror = () => hata(istek.error);
    });
  }
  const sar = (istek) => new Promise((cozum, hata) => { istek.onsuccess = () => cozum(istek.result); istek.onerror = () => hata(istek.error); });
  const depo = (ad, mod) => db.transaction(ad, mod).objectStore(ad);
  return { ac,
    getir:(d,k)=>sar(depo(d,'readonly').get(k)), hepsi:(d)=>sar(depo(d,'readonly').getAll()),
    yaz:(d,v)=>sar(depo(d,'readwrite').put(v)), sil:(d,k)=>sar(depo(d,'readwrite').delete(k)),
    bosalt:(d)=>sar(depo(d,'readwrite').clear()) };
})();

/* JPEG içindeki EXIF bilgisinden çekim tarihi ve GPS konumu okunur */
async function exifOku(dosya) {
  try {
    const tampon = await dosya.slice(0, 256 * 1024).arrayBuffer();
    const dv = new DataView(tampon);
    if (dv.getUint16(0) !== 0xFFD8) return null;
    let ofs = 2;
    while (ofs < dv.byteLength - 4) {
      const isaret = dv.getUint16(ofs);
      if ((isaret & 0xFF00) !== 0xFF00) break;
      const uzunluk = dv.getUint16(ofs + 2);
      if (isaret === 0xFFE1 && dv.getUint32(ofs + 4) === 0x45786966) return tiffOku(dv, ofs + 10);
      ofs += 2 + uzunluk;
    }
  } catch (e) {}
  return null;
}
function tiffOku(dv, bas) {
  try {
    const le = dv.getUint16(bas) === 0x4949;
    const u16 = (o) => dv.getUint16(o, le), u32 = (o) => dv.getUint32(o, le);
    if (u16(bas + 2) !== 0x002A) return null;
    const BOYUT = {1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8};
    const ifdOku = (ofset) => {
      const harita = {}, n = u16(ofset);
      for (let i = 0; i < n; i++) {
        const g = ofset + 2 + i * 12, etiket = u16(g), tip = u16(g + 2), sayi = u32(g + 4);
        const bayt = (BOYUT[tip] || 1) * sayi;
        harita[etiket] = {tip, sayi, ofs: bayt > 4 ? bas + u32(g + 8) : g + 8};
      }
      return harita;
    };
    const metin = (e) => {
      let s2 = '';
      for (let i = 0; i < e.sayi; i++) { const c = dv.getUint8(e.ofs + i); if (c) s2 += String.fromCharCode(c); }
      return s2.trim();
    };
    const kesir = (e, i) => { const pay = u32(e.ofs + i * 8), payda = u32(e.ofs + i * 8 + 4); return payda ? pay / payda : 0; };
    const ana = ifdOku(bas + u32(bas + 4));
    const sonuc = {};
    if (ana[0x8769]) {
      const exif = ifdOku(bas + u32(ana[0x8769].ofs));
      const t = exif[0x9003] || exif[0x9004];
      if (t) sonuc.tarih = metin(t);
    }
    if (!sonuc.tarih && ana[0x0132]) sonuc.tarih = metin(ana[0x0132]);
    if (ana[0x010F] || ana[0x0110]) {
      sonuc.kamera = [ana[0x010F] ? metin(ana[0x010F]) : '', ana[0x0110] ? metin(ana[0x0110]) : ''].filter(Boolean).join(' ');
    }
    if (sonuc.tarih) {
      const m = /^(\d{4})[:\-](\d{2})[:\-](\d{2})/.exec(sonuc.tarih);
      sonuc.tarih = m ? `${m[1]}-${m[2]}-${m[3]}` : '';
    }
    if (ana[0x8825]) {
      const gps = ifdOku(bas + u32(ana[0x8825].ofs));
      if (gps[2] && gps[4]) {
        const derece = (e) => kesir(e, 0) + kesir(e, 1) / 60 + kesir(e, 2) / 3600;
        let lat = derece(gps[2]), lon = derece(gps[4]);
        if (gps[1] && metin(gps[1]).toUpperCase() === 'S') lat = -lat;
        if (gps[3] && metin(gps[3]).toUpperCase() === 'W') lon = -lon;
        if (lat || lon) { sonuc.lat = lat; sonuc.lon = lon; }
      }
    }
    return sonuc;
  } catch (e) { return null; }
}
/* Koordinattan yer adı: OpenStreetMap'in ücretsiz servisi, sırayla ve yavaş sorgulanır */
const yerKuyruk = [];
let yerCalisiyor = false;
function yerAdiIste(lat, lon, uygula) { yerKuyruk.push({lat, lon, uygula}); yerKuyrukIsle(); }
async function yerKuyrukIsle() {

        {headers: {'Accept-Language': dil}});
      const veri = await cevap.json();

      if (ad) { await is.uygula(ad); bulunan++; }

  }
  yerCalisiyor = false;
}

/* 8x8 gri ölçek imzası: aynı fotoğrafın tekrar eklenmesini yakalamak için */
async function fotoImza(blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const c = document.createElement('canvas');
    c.width = 8; c.height = 8;
    const x = c.getContext('2d');
    x.drawImage(bmp, 0, 0, 8, 8);
    bmp.close && bmp.close();
    const d = x.getImageData(0, 0, 8, 8).data;
    const gri = [];
    for (let i = 0; i < 64; i++) gri.push((d[i*4] * .299 + d[i*4+1] * .587 + d[i*4+2] * .114));
    const ort = gri.reduce((a, b) => a + b, 0) / 64;
    let bit = '';
    gri.forEach(g => bit += g > ort ? '1' : '0');
    return parseInt(bit.slice(0, 32), 2).toString(16) + parseInt(bit.slice(32), 2).toString(16);
  } catch { return null; }
}

async function blobVeriAdresi(blob, enBuyukKenar = 1600, kalite = .85) {
  if (!blob) return null;
  let resim;
  try { resim = await createImageBitmap(blob); } catch { return null; }
  const olcek = Math.min(1, enBuyukKenar / Math.max(resim.width, resim.height));
  const g = Math.round(resim.width * olcek), y = Math.round(resim.height * olcek);
  const tuval = document.createElement('canvas');
  tuval.width = g; tuval.height = y;
  const bg = tuval.getContext('2d');
  bg.fillStyle = '#000'; bg.fillRect(0, 0, g, y);
  bg.drawImage(resim, 0, 0, g, y);
  resim.close && resim.close();
  return {veri: tuval.toDataURL('image/jpeg', kalite), g, y};
}
function yaziGorseli(satirlar, {genislik = 2200, punto = 46, renk = '#2F2A35', hiza = 'left', kalin = false, aralik = 1.35} = {}) {
  const tuval = document.createElement('canvas');
  let bg = tuval.getContext('2d');
  const yazitipi = `${kalin ? '700' : '400'} ${punto}px Nunito, Arial, sans-serif`;
  bg.font = yazitipi;
  const dolgu = 10, sinir = genislik - dolgu * 2, cikti = [];
  satirlar.filter(Boolean).forEach(satir => {
    let mevcut = '';
    satir.toString().split(/\s+/).forEach(kelime => {
      const deneme = mevcut ? mevcut + ' ' + kelime : kelime;
      if (bg.measureText(deneme).width > sinir && mevcut) { cikti.push(mevcut); mevcut = kelime; } else mevcut = deneme;
    });
    cikti.push(mevcut);
  });
  tuval.width = genislik;
  tuval.height = Math.max(1, Math.ceil(cikti.length * punto * aralik) + dolgu * 2);
  bg = tuval.getContext('2d');
  bg.font = yazitipi; bg.fillStyle = renk; bg.textBaseline = 'top';
  cikti.forEach((satir, i) => {
    const x = hiza === 'center' ? (genislik - bg.measureText(satir).width) / 2 : dolgu;
    bg.fillText(satir, x, dolgu + i * punto * aralik);
  });
  return {veri: tuval.toDataURL('image/png'), g: tuval.width, y: tuval.height};
}

    diliUygula(); menuCiz();
    return;
  }
  if (is === 'giris') { menuAc(false); return authAc('giris'); }
  if (is === 'kayit') { menuAc(false); return authAc('kayit'); }
  if (is === 'cikis') { menuAc(false); return cikisYap(); }
  if (is === 'talep') { menuAc(false); $('#talepPencere').classList.remove('hidden'); return; }
  if (is === 'admin') { menuAc(false); return adminAc(); }
  if (is === 'profilKaldir') { await profilKaldir(); return; }
  if (is === 'notTanimEkle') {
    const yeni = await notTanimPenceresi();
    if (yeni) menuCiz();
    return;
  }
  if (is === 'notTanimSil') {
    const sec = $('#menuNotSec');
    if (!sec || !sec.value) return bildir(T('not_tanim_secilmedi'), 'hata');
    const kullanim = notTanimKullanim(sec.value);
    if (kullanim && !confirm(T('not_tanim_kullanimda', {n: kullanim}))) return;
    durum.notTanimlari = durum.notTanimlari.filter(x => x.id !== sec.value);
    await ayarYaz('notTanimlari', durum.notTanimlari);
    menuCiz();
    return;
  }
  if (is === 'etiketEkle') return etiketEkle();
  if (is === 'etiketSil') {
    const sec = $('#menuEtiketSec');
    if (!sec || !sec.value) return bildir(T('etiket_secilmedi'), 'hata');
    menuAc(false); return etiketSilPencereAc(sec.value);
  }
  if (is === 'yedekAl')    { menuAc(false); return yedekAl(); }
  if (is === 'yedekYukle') { menuAc(false); return yedekYukle(); }
  if (is === 'izin') {
    const ok = await Depo.izinIste();
    if (!ok) return bildir(T('izin_gerekli'), 'hata');
    durum.albumler = await Depo.albumleriOku();
    durum.takvimler = await Depo.takvimleriOku();
    if (!durum.seciliAlbum && durum.albumler[0]) durum.seciliAlbum = durum.albumler[0].id;
    diliUygula(); menuCiz();
    return;
  }
  if (is === 'sec') {
    try {
      const oncekiler = durum.albumler.slice();
      const tarayicidaydi = !Depo.klasorAktif();
      await Depo.klasorSec();
      if (tarayicidaydi && oncekiler.length && confirm(T('tasima_soru', {n: oncekiler.length}))) {
        bekle(T('tasiniyor'));
        for (const a of oncekiler) await albumuKlasoreTasi(a);
        await VT.bosalt('albumler'); await VT.bosalt('medya');
        adresBellek.clear();
        bekleKapat();
      }
      durum.albumler = await Depo.albumleriOku();
      durum.takvimler = await Depo.takvimleriOku();
      if (!albumBul() && durum.albumler[0]) durum.seciliAlbum = durum.albumler[0].id;
      diliUygula(); menuCiz();
      bildir(T('klasor_secildi'));
    } catch (e) { if (e && e.name !== 'AbortError') bildir(T('klasor_hata'), 'hata'); }
  }
}
async function albumuKlasoreTasi(a) {
  a.klasor = await Depo.benzersizKlasor(Depo.kok, slug(a.ad));
  await Depo.kok.getDirectoryHandle(a.klasor, {create: true});
  for (const g of a.gruplar) {
    g.klasor = g.klasor || slug(g.ad);
    const dizin = await Depo.grupDizin(a, g, true);
    for (const f of g.fotograflar) {
      if (!f.medyaId) continue;
      const m = await VT.getir('medya', f.medyaId);
      if (!m) continue;
      const ad = await Depo.benzersizDosya(dizin, (m.ad || 'foto.jpg').replace(/[\\/:*?"<>|]/g, '-'));
      const tutamac = await dizin.getFileHandle(ad, {create: true});
      const yazici = await tutamac.createWritable();
      await yazici.write(m.blob); await yazici.close();
      f.dosyaAdi = ad; f.boyut = m.boyut || m.blob.size; delete f.medyaId;
    }
  }
  if (a.muzik && a.muzik.medyaId) {
    const m = await VT.getir('medya', a.muzik.medyaId);
    if (m) a.muzik = await Depo.muzikYaz(a, new File([m.blob], m.ad || 'music.mp3', {type: m.tip}));
  }
  await Depo.albumYaz(a);
}
async function depoDurumu() {
  const el = $('#depoBilgi');
  if (!el) return;
  if (Depo.klasorAktif()) { el.textContent = '📂 ' + Depo.kokAd; return; }
  if (!navigator.storage || !navigator.storage.estimate) { el.textContent = ''; return; }
  try {
    const {usage, quota} = await navigator.storage.estimate();
    el.textContent = T('depo_bilgi', {u: boyut(usage || 0), q: boyut(quota || 0)});
  } catch { el.textContent = ''; }
}


/* =========================================================================
   HIZLI ALBÜM SİHİRBAZI
   Tarayıcı galeriye kendiliğinden bakamaz; kişi fotoğrafları seçtikten sonra
   tarih ve kaynağa göre süzüp albümü kuran kısmı biz üstleniyoruz.
   ========================================================================= */
const hizli = {dosyalar: [], secili: new Set(), kaynaklar: new Set(['kamera', 'whatsapp', 'ekran', 'diger']), adresler: []};
const KAYNAKLAR = ['kamera', 'whatsapp', 'ekran', 'diger'];

function kaynakBul(dosya, exif) {
  const ad = (dosya.name || '').toLowerCase();
  if (/whatsapp|^wa\d|img-\d{8}-wa/i.test(ad)) return 'whatsapp';
  if (/screenshot|screen shot|ekran|simulator/i.test(ad)) return 'ekran';
  if (exif && exif.kamera) return 'kamera';
  if (exif && exif.tarih) return 'kamera';
  return 'diger';
}
const gunAnahtarindan = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function hizliAc() {
  hizliTemizle();
  $('#hizliAdim1').classList.remove('hidden');
  $('#hizliAdim2').classList.add('hidden');
  $('#hizliAdim3').classList.add('hidden');
  $('#hizliPencere').classList.remove('hidden');
  izle('quick_album_open');
}
function hizliTemizle() {
  hizli.adresler.forEach(u => URL.revokeObjectURL(u));
  hizli.adresler = [];
  hizli.dosyalar = [];
  hizli.secili = new Set();
  hizli.kaynaklar = new Set(KAYNAKLAR);
  $('#hizliIzgara').innerHTML = '';
}
function hizliKapat() { hizliTemizle(); $('#hizliPencere').classList.add('hidden'); }

async function hizliDosyaAl(klasorden) {
  const girdi = document.createElement('input');
  girdi.type = 'file'; girdi.accept = 'image/*'; girdi.multiple = true;
  if (klasorden) { girdi.webkitdirectory = true; girdi.directory = true; }
  girdi.style.display = 'none';
  document.body.appendChild(girdi);
  const dosyalar = await new Promise(cozum => {
    girdi.addEventListener('change', () => { cozum(Array.from(girdi.files || [])); girdi.remove(); });
    girdi.click();
  });
  const resimler = dosyalar.filter(d => d.type.startsWith('image/'));
  if (!resimler.length) return bildir(T('hizli_secilmedi'), 'hata');

  bekle(T('hizli_okunuyor', {i: 0, n: resimler.length}));
  hizliTemizle();
  let i = 0;
  for (const d of resimler) {
    i++;
    if (i % 5 === 0 || i === resimler.length) { bekleMetin(T('hizli_okunuyor', {i, n: resimler.length})); bekleOran(i / resimler.length * 100); }
    const exif = await exifOku(d);
    const tarih = (exif && exif.tarih) || (d.lastModified ? gunAnahtarindan(new Date(d.lastModified)) : '');
    hizli.dosyalar.push({dosya: d, exif, tarih, kaynak: kaynakBul(d, exif)});
  }
  bekleKapat();

  // varsayılan aralık: en yeni fotoğraftan geriye bir hafta
  const tarihler = hizli.dosyalar.map(x => x.tarih).filter(Boolean).sort();
  const enYeni = tarihler.length ? new Date(tarihler[tarihler.length - 1]) : new Date();
  const bas = new Date(enYeni); bas.setDate(bas.getDate() - 6);
  $('#hizliBit').value = gunAnahtarindan(enYeni);
  $('#hizliBas').value = gunAnahtarindan(bas);

  $('#hizliAdim2').classList.remove('hidden');
  $('#hizliAdim3').classList.remove('hidden');
  hizliKaynakCiz();
  hizliSuz();
}
function hizliKaynakCiz() {
  const varOlan = [...new Set(hizli.dosyalar.map(x => x.kaynak))];
  $('#hizliKaynaklar').innerHTML = KAYNAKLAR.filter(k => varOlan.includes(k)).map(k => {
    const adet = hizli.dosyalar.filter(x => x.kaynak === k).length;
    return `<label class="flex items-center gap-2 text-sm font-semibold">
      <input type="checkbox" data-kaynak="${k}" ${hizli.kaynaklar.has(k) ? 'checked' : ''} class="w-4 h-4 accent-pembe">
      ${T('kaynak_' + k)} (${adet})</label>`;
  }).join('');
  $$('[data-kaynak]', $('#hizliKaynaklar')).forEach(i => i.onchange = () => {
    i.checked ? hizli.kaynaklar.add(i.dataset.kaynak) : hizli.kaynaklar.delete(i.dataset.kaynak);
    hizliSuz();
  });
}
function hizliUygun(x) {
  const bas = $('#hizliBas').value, bit = $('#hizliBit').value;
  if (!hizli.kaynaklar.has(x.kaynak)) return false;
  if (bas && (!x.tarih || x.tarih < bas)) return false;
  if (bit && (!x.tarih || x.tarih > bit)) return false;
  return true;
}
function hizliSuz() {
  const uygun = hizli.dosyalar.filter(hizliUygun);
  hizli.secili = new Set(uygun.map(x => hizli.dosyalar.indexOf(x)));
  $('#hizliOzet').textContent = T('hizli_ozet', {n: hizli.dosyalar.length, t: uygun.length});
  const izgara = $('#hizliIzgara');
  if (!uygun.length) { izgara.innerHTML = `<p class="col-span-full text-sm text-soluk">${T('hizli_bos')}</p>`; return; }

  izgara.innerHTML = uygun.map(x => {
    const i = hizli.dosyalar.indexOf(x);
    return `<button data-hfoto="${i}" class="relative rounded-xl overflow-hidden bg-kagit aspect-square">
      <img data-hres="${i}" alt="" class="w-full h-full object-cover">
    </button>`;
  }).join('');
  uygun.forEach(x => {
    const i = hizli.dosyalar.indexOf(x);
    const img = izgara.querySelector(`[data-hres="${i}"]`);
    if (!img) return;
    const u = URL.createObjectURL(x.dosya);
    hizli.adresler.push(u);
    img.src = u;
  });
  $$('[data-hfoto]', izgara).forEach(b => b.onclick = () => {
    const i = +b.dataset.hfoto;
    if (hizli.secili.has(i)) { hizli.secili.delete(i); b.style.opacity = '.3'; }
    else { hizli.secili.add(i); b.style.opacity = '1'; }
  });

  // albüm adı önerisi: tarih aralığı
  const bas = $('#hizliBas').value, bit = $('#hizliBit').value;
  if (bas && bit) {
    const b1 = new Date(bas), b2 = new Date(bit);
    const ayni = b1.getMonth() === b2.getMonth() && b1.getFullYear() === b2.getFullYear();
    $('#hizliAd').value = ayni
      ? `${b1.getDate()}–${b2.getDate()} ${b2.toLocaleDateString(yerelKod(), {month: 'long', year: 'numeric'})}`
      : `${kisaTarih(b1)} – ${kisaTarih(b2)}`;
  }
}

async function hizliAlbumOlustur() {
  const secilenler = [...hizli.secili].map(i => hizli.dosyalar[i]).filter(Boolean);
  if (!secilenler.length) return bildir(T('hizli_bos'), 'hata');
  let ad = $('#hizliAd').value.trim();
  if (!ad) return bildir(T('ad_gerekli'), 'hata');
  if (durum.albumler.some(a => kucuk(a.ad) === kucuk(ad))) ad = ad + ' ' + new Date().getFullYear();

  secilenler.sort((x, y) => (x.tarih || '').localeCompare(y.tarih || ''));
  const gunlereGore = $('#hizliGruplama').checked;
  const grupAdlari = gunlereGore
    ? [...new Set(secilenler.map(x => x.tarih || ''))].map(t => ({
        anahtar: t,
        ad: t ? new Date(t).toLocaleDateString(yerelKod(), {day: 'numeric', month: 'long', weekday: 'long'}) : (dil === 'tr' ? 'Tarihsiz' : 'No date')
      }))
    : [{anahtar: '*', ad: dil === 'tr' ? 'Genel' : 'General'}];

  const a = {id: kimlik(), ad, ithaf: '', etiket: null, gosteri: Object.assign({}, GOSTERI_VARSAYILAN),
             olusturuldu: Date.now(), guncellendi: Date.now(), kapak: null, muzik: null, klasor: null,
             gruplar: grupAdlari.map(g => ({id: kimlik(), ad: g.ad, klasor: slug(g.ad), olusturuldu: Date.now(), fotograflar: []}))};

  if (Depo.klasorAktif()) {
    a.klasor = await Depo.benzersizKlasor(Depo.kok, slug(ad));
    await Depo.kok.getDirectoryHandle(a.klasor, {create: true});
    for (const g of a.gruplar) {
      const dizin = await Depo.albumDizin(a, true);
      g.klasor = await Depo.benzersizKlasor(dizin, slug(g.ad));
      await dizin.getDirectoryHandle(g.klasor, {create: true});
    }
  }

  bekle(T('foto_kaydediliyor', {i: 0, n: secilenler.length}));
  const yerBekleyen = [];
  let i = 0;
  for (const x of secilenler) {
    i++; bekleMetin(T('foto_kaydediliyor', {i, n: secilenler.length})); bekleOran(i / secilenler.length * 100);
    const gi = gunlereGore ? grupAdlari.findIndex(g => g.anahtar === (x.tarih || '')) : 0;
    const g = a.gruplar[Math.max(0, gi)];
    const imza = await fotoImza(x.dosya);
    const kayit = await Depo.fotoYaz(a, g, x.dosya);
    const f = {id: kimlik(), baslik: '', tarih: x.tarih || '', yer: '', not: '', imza, eklendi: Date.now(), ...kayit};
    if (x.exif && x.exif.lat) { f.lat = x.exif.lat; f.lon = x.exif.lon; yerBekleyen.push(f); }
    g.fotograflar.push(f);
    if (!a.kapak) a.kapak = f.id;
  }
  durum.albumler.push(a);
  await albumKaydet(a);
  bekleKapat();
  hizliKapat();
  izle('quick_album_created', {photos: secilenler.length, groups: a.gruplar.length});
  kullanimGonder();
  etiketFiltreCiz(); listeCiz(); onizlemeCiz(); bugunSeritCiz(); yedekHatirlat();
  albumAc(a.id);
  bildir(T('hizli_hazir'));
  yerBekleyen.forEach(f => yerAdiIste(f.lat, f.lon, async (yerAdi) => {
    if (!f.yer) { f.yer = yerAdi; await albumKaydet(a); if (durum.ekran === 'detay') detayCiz(); }
  }));
}

/* --- Bugün şeridi: geçmiş yıllardaki anılar ve yaklaşan özel günler --- */
function bugunAnahtar() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function tarihteBugun() {
  const simdi = new Date();
  const ay = simdi.getMonth() + 1, gun = simdi.getDate(), yil = simdi.getFullYear();
  const cikti = [];
  durum.albumler.forEach(a => tumFotograflar(a).forEach(x => {
    const t = x.foto.tarih;
    if (!t) return;
    const p2 = t.split('-');
    if (+p2[1] !== ay || +p2[2] !== gun || +p2[0] >= yil) return;
    cikti.push({album: a, grup: x.grup, foto: x.foto, yilFarki: yil - +p2[0]});
  }));
  return cikti.sort((x, y) => x.yilFarki - y.yilFarki).slice(0, 8);
}

function yaklasanGunler(pencere = 21) {
  const simdi = new Date();
  simdi.setHours(0, 0, 0, 0);
  const cikti = [];
  durum.takvimler.forEach(t => {
    Object.keys(t.notlar || {}).forEach(anahtar => {
      const not = notNesne(t.notlar[anahtar]);
      if (!not) return;
      const p2 = anahtar.split('-');
      // doğum günü gibi kayıtlar her yıl tekrar eder: gün ve ayı bu yıla taşıyoruz
      let hedef = new Date(simdi.getFullYear(), +p2[1] - 1, +p2[2]);
      hedef.setHours(0, 0, 0, 0);
      if (hedef < simdi) hedef = new Date(simdi.getFullYear() + 1, +p2[1] - 1, +p2[2]);
      const fark = Math.round((hedef - simdi) / 86400000);
      if (fark > pencere) return;
      if (cikti.some(z => z.fark === fark && kucuk(z.metin) === kucuk(not.metin))) return;
      cikti.push({fark, metin: not.metin, emoji: not.emoji, takvim: t, tarih: hedef});
    });
  });
  return cikti.sort((x, y) => x.fark - y.fark).slice(0, 6);
}

function bugunSeritCiz() {
  const kutu = $('#bugunSerit');
  if (!kutu) return;
  if (localStorage.getItem('bugunKapat') === bugunAnahtar()) { kutu.classList.add('hidden'); return; }
  const anilar = tarihteBugun(), yaklasan = yaklasanGunler();
  const sonHareket = durum.albumler.reduce((t, a) => Math.max(t, a.guncellendi || a.olusturuldu || 0), 0);
  const gecenGun = sonHareket ? Math.floor((Date.now() - sonHareket) / 86400000) : null;
  const oneriGoster = gecenGun === null || gecenGun >= 7;
  if (!anilar.length && !yaklasan.length && !oneriGoster) { kutu.classList.add('hidden'); kutu.innerHTML = ''; return; }

  const gunMetni = (fark) => fark === 0 ? T('bugun_kelime') : fark === 1 ? T('yarin_kelime') : T('gun_sonra', {n: fark});
  kutu.className = 'mb-5 grid md:grid-cols-2 gap-4';
  kutu.innerHTML = `
    ${anilar.length ? `
    <div class="bg-white rounded-3xl shadow-kart p-4">
      <div class="flex items-center mb-2">
        <p class="font-baslik font-semibold mr-auto">${T('tarihte_bugun')}</p>
        <button class="btn btn-sade text-xs" data-bugun="kapat">${T('serit_kapat')}</button>
      </div>
      <div class="flex gap-2 overflow-x-auto pb-1">
        ${anilar.map((x, i) => `
          <button data-ani="${i}" class="shrink-0 w-24 text-left">
            <img data-anifoto="${i}" alt="" class="w-24 h-24 object-cover rounded-2xl bg-kagit">
            <p class="text-[11px] text-soluk mt-1 truncate">${T('yil_once', {n: x.yilFarki})}</p>
            <p class="text-[11px] truncate">${kacan(x.foto.baslik || x.album.ad)}</p>
          </button>`).join('')}
      </div>
    </div>` : ''}
    ${oneriGoster ? `
    <div class="bg-white rounded-3xl shadow-kart p-4 flex flex-col justify-center">
      <p class="font-baslik font-semibold mb-1">${T('oneri_baslik')}</p>
      <p class="text-sm text-soluk mb-3">${gecenGun === null ? T('oneri_ilk') : T('oneri_metin', {n: gecenGun})}</p>
      <button class="btn btn-ana w-fit" data-bugun="hizli">${T('hizli_album')}</button>
    </div>` : ''}
    ${yaklasan.length ? `
    <div class="bg-white rounded-3xl shadow-kart p-4">
      <div class="flex items-center mb-2">
        <p class="font-baslik font-semibold mr-auto">${T('yaklasan_gunler')}</p>
        ${anilar.length ? '' : `<button class="btn btn-sade text-xs" data-bugun="kapat">${T('serit_kapat')}</button>`}
      </div>
      <div class="space-y-1">
        ${yaklasan.map((y, i) => `
          <button data-yaklasan="${i}" class="w-full flex items-center gap-2 text-left text-sm rounded-xl border border-cizgi px-3 py-1.5 hover:bg-kagit">
            <span class="w-6 text-center">${y.emoji || '📌'}</span>
            <span class="flex-1 truncate">${kacan(y.metin)}</span>
            <span class="text-xs font-semibold ${y.fark <= 1 ? 'text-pembe' : 'text-soluk'}">${gunMetni(y.fark)}</span>
          </button>`).join('')}
      </div>
    </div>` : ''}`;
  kutu.classList.remove('hidden');

  anilar.forEach(async (x, i) => {
    const img = kutu.querySelector(`[data-anifoto="${i}"]`);
    const adres = await Depo.fotoAdres(x.album, x.grup, x.foto);
    if (img && adres) img.src = adres;
  });
  $$('[data-ani]', kutu).forEach(b => b.onclick = () => {
    const x = anilar[+b.dataset.ani];
    izle('onthisday_open');
    sekmeAc('tasarim'); albumAc(x.album.id);
  });
  $$('[data-yaklasan]', kutu).forEach(b => b.onclick = () => {
    const y = yaklasan[+b.dataset.yaklasan];
    izle('upcoming_open', {days: y.fark});
    sekmeAc('takvim'); takvimAc(y.takvim.id);
  });
  $$('[data-bugun="hizli"]', kutu).forEach(b => b.onclick = hizliAc);
  $$('[data-bugun="kapat"]', kutu).forEach(b => b.onclick = () => {
    localStorage.setItem('bugunKapat', bugunAnahtar());
    kutu.classList.add('hidden');
  });
}

/* ---------- 7) ALBÜM LİSTESİ -------------------------------------------- */
function ekranGoster() {
  $('#ekranListe').classList.toggle('hidden', durum.ekran !== 'liste');
  $('#ekranDetay').classList.toggle('hidden', durum.ekran !== 'detay');
}
function boyutUyari(b) {
  if (b > 25e6) return {sinif:'text-pembe', metin: T('mail_cok_buyuk')};
  if (b > MAIL_SINIR) return {sinif:'text-seftali', metin: T('mail_buyuk')};
  return null;
}
function kapakFoto(a) {
  const hepsi = tumFotograflar(a);
  if (!hepsi.length) return null;
  return (a.kapak && hepsi.find(x => x.foto.id === a.kapak)) || hepsi[0];
}
function kapakYukle(kok = document) {
  $$('img[data-kapak]', kok).forEach(async img => {
    const a = durum.albumler.find(x => x.id === img.dataset.kapak);
    const k = a && kapakFoto(a);
    if (!k) return;
    const adres = await Depo.fotoAdres(a, k.grup, k.foto);
    if (adres) img.src = adres;
  });
}
async function etiketEkle() {
  const ad = await metinSor({baslik: T('etiket_adi'), ipucu: T('ornek_etiket'),
    dogrula: (v) => !v ? T('ad_gerekli') : durum.etiketler.some(e => kucuk(e.ad) === kucuk(v)) ? T('etiket_var') : null});
  if (!ad) return;
  durum.etiketler.push({id: kimlik(), ad});
  await ayarYaz('etiketler', durum.etiketler);
  menuCiz(); etiketFiltreCiz();
}
function etiketSilPencereAc(id) {
  const e = durum.etiketler.find(x => x.id === id);
  if (!e) return;
  const kullanan = etiketKullanan(id);
  $('#etiketSilBaslik').textContent = T('etiket_sil_baslik', {ad: e.ad});
  $('#etiketSilDurum').textContent = kullanan.length ? T('etiket_kullanimda') : T('etiket_bos');
  $('#etiketSilAlbumler').innerHTML = kullanan.map(a =>
    `<button class="w-full text-left rounded-xl border border-cizgi px-3 py-2 hover:bg-kagit" data-git="${a.id}">
       📁 ${kacan(a.ad)} <span class="text-xs text-soluk">→ ${T('etiket_btn')}</span></button>`).join('');
  $$('#etiketSilAlbumler [data-git]').forEach(b => b.onclick = () => {
    $('#etiketSilPencere').classList.add('hidden');
    sekmeAc('tasarim'); albumAc(b.dataset.git);
  });
  const onay = $('#etiketSilOnay');
  onay.disabled = kullanan.length > 0;
  onay.onclick = async () => {
    durum.etiketler = durum.etiketler.filter(x => x.id !== id);
    await ayarYaz('etiketler', durum.etiketler);
    if (durum.filtre === id) durum.filtre = null;
    $('#etiketSilPencere').classList.add('hidden');
    etiketFiltreCiz(); listeCiz(); menuCiz();
  };
  $('#etiketSilPencere').classList.remove('hidden');
}
function etiketSecPencereAc(a) {
  return new Promise(cozum => {
    const secili = albumEtiket(a) || '';
    $('#etiketSecBaslik').textContent = T('etiket_sec');
    $('#etiketSecAciklama').textContent = T('etiket_sec_aciklama', {ad: a.ad});
    $('#etiketSecListe').innerHTML = durum.etiketler.length
      ? `<label class="block text-sm font-semibold mb-1">${T('etiket_sec_tek')}</label>
         <select id="etiketSecAlan" class="alan">
           <option value="">${T('etiketsiz')}</option>
           ${durum.etiketler.map(e => `<option value="${e.id}" ${secili === e.id ? 'selected' : ''}>🏷️ ${kacan(e.ad)}</option>`).join('')}
         </select>`
      : `<p class="text-soluk text-sm">${T('etiket_yok')}</p>`;
    const pencere = $('#etiketSecPencere');
    pencere.classList.remove('hidden');
    function kapat(sonuc) { pencere.classList.add('hidden'); $('#etiketSecTamam').onclick = null; $('#etiketSecIptal').onclick = null; cozum(sonuc); }
    $('#etiketSecTamam').onclick = () => { const alan = $('#etiketSecAlan'); kapat(alan ? (alan.value || null) : null); };
    $('#etiketSecIptal').onclick = () => kapat(undefined);
  });
}
function etiketFiltreCiz() {
  const kutu = $('#etiketFiltre');
  kutu.classList.toggle('hidden', !durum.etiketler.length);
  if (!durum.etiketler.length) { kutu.innerHTML = ''; return; }
  const secili = durum.filtre || '';
  kutu.innerHTML = `<option value="">${T('etiket_filtre_hepsi')}</option>` +
    durum.etiketler.map(e => `<option value="${e.id}" ${secili === e.id ? 'selected' : ''}>🏷️ ${kacan(e.ad)}</option>`).join('') +
    `<option value="yok" ${secili === 'yok' ? 'selected' : ''}>${T('etiketsiz')}</option>`;
}

function listeCiz() {
  const yon = $('#albumSirala').value || 'yeni';
  const suzulmus = durum.albumler.filter(a =>
    !durum.filtre ? true : durum.filtre === 'yok' ? !albumEtiket(a) : albumEtiket(a) === durum.filtre);
  const liste = suzulmus.slice().sort((a, b) =>
      yon === 'eski'  ? a.olusturuldu - b.olusturuldu
    : yon === 'adAZ'  ? a.ad.localeCompare(b.ad, yerelKod())
    : yon === 'adZA'  ? b.ad.localeCompare(a.ad, yerelKod())
    : yon === 'buyuk' ? albumBoyut(b) - albumBoyut(a)
    : b.olusturuldu - a.olusturuldu);

  $('#listeOzet').textContent = T('ozet', {n: liste.length, b: boyut(liste.reduce((t, a) => t + albumBoyut(a), 0))});
  $$('[data-gorunum]').forEach(b => b.style.background = b.dataset.gorunum === durum.gorunum ? '#F0EEF3' : 'transparent');

  const kutu = $('#albumListe');
  if (!durum.albumler.length) {
    kutu.className = '';
    kutu.innerHTML = `<div class="bg-white rounded-3xl shadow-kart p-10 text-center">
      <h3 class="font-baslik text-xl font-semibold mb-1">${T('bos_baslik')}</h3>
      <p class="text-soluk">${T('bos_metin')}</p></div>`;

  const kart = (a) => {
    const n = tumFotograflar(a).length, b = albumBoyut(a), u = boyutUyari(b);
    return `<button data-ac="${a.id}" class="text-left bg-white rounded-3xl shadow-kart hover:shadow-kalk transition overflow-hidden">
      <div class="aspect-[4/3] bg-kagit p-2"><img data-kapak="${a.id}" alt="" class="w-full h-full object-contain rounded-xl"></div>
      <div class="p-4">
        <h3 class="font-baslik text-lg font-semibold leading-tight">${kacan(a.ad)}</h3>
        ${a.ithaf ? `<p class="text-xs italic text-lila truncate">🎁 ${kacan(a.ithaf)}</p>` : ''}
        ${etiketAdi(albumEtiket(a)) ? `<p class="text-xs text-soluk truncate">🏷️ ${kacan(etiketAdi(albumEtiket(a)))}</p>` : ''}
        <p class="text-xs text-soluk mt-1">${T('olusturuldu', {tarih: kisaTarih(a.olusturuldu)})}</p>
        <p class="text-sm mt-1">${T('foto_sayi', {n})} · ${T('grup_sayi', {n: a.gruplar.length})} · ${boyut(b)}</p>
        ${u ? `<p class="text-xs font-semibold ${u.sinif} mt-1">${u.metin}</p>` : ''}
      </div></button>`;
  };
  const satir = (a) => {
    const n = tumFotograflar(a).length, b = albumBoyut(a), u = boyutUyari(b);
    return `<button data-ac="${a.id}" class="w-full text-left bg-white rounded-2xl shadow-kart hover:shadow-kalk transition p-3 flex items-center gap-3">
      <div class="w-16 h-14 rounded-xl bg-kagit shrink-0 p-1"><img data-kapak="${a.id}" alt="" class="w-full h-full object-contain"></div>
      <div class="min-w-0 flex-1">
        <h3 class="font-baslik font-semibold leading-tight truncate">${kacan(a.ad)}</h3>
        <p class="text-xs text-soluk truncate">${T('olusturuldu', {tarih: kisaTarih(a.olusturuldu)})} · ${T('foto_sayi', {n})} · ${T('grup_sayi', {n: a.gruplar.length})}${a.ithaf ? ' · 🎁 ' + kacan(a.ithaf) : ''}</p>
      </div>
      <div class="text-right shrink-0"><p class="text-sm font-semibold">${boyut(b)}</p>
        ${u ? `<p class="text-[11px] font-semibold ${u.sinif}">${u.metin}</p>` : ''}</div></button>`;
  };
  kutu.className = durum.gorunum === 'izgara' ? 'grid sm:grid-cols-2 lg:grid-cols-3 gap-4' : 'space-y-2';
  kutu.innerHTML = liste.map(durum.gorunum === 'izgara' ? kart : satir).join('');
  kapakYukle(kutu);
  $$('#albumListe [data-ac]').forEach(b => b.onclick = () => albumAc(b.dataset.ac));
}
async function albumAc(id) {

/* ---------- 8) ALBÜM DETAYI --------------------------------------------- */

          <button class="btn btn-sade text-pembe" data-is="albumSil">${T('album_sil')}</button>
        </div>
      </div>
      <div class="rounded-2xl border border-cizgi p-3 mt-4">
        <p class="font-semibold text-sm mb-2">🎬 ${T('gosteri_ayarlari')}</p>
        <div class="grid sm:grid-cols-3 gap-3 items-end">
          <div>
            <label class="block text-xs font-semibold mb-1">${T('gecis_temasi')}</label>
            <select id="dTema" class="alan">
              <option value="t-fade" ${ayar.tema === 't-fade' ? 'selected' : ''}>${T('tema_fade')}</option>
              <option value="t-slide" ${ayar.tema === 't-slide' ? 'selected' : ''}>${T('tema_slide')}</option>
              <option value="t-zoom" ${ayar.tema === 't-zoom' ? 'selected' : ''}>${T('tema_zoom')}</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">${T('foto_suresi')}: <span id="dSureMetin">${ayar.sure}${dil === 'tr' ? ' sn' : ' s'}</span></label>
            <input id="dSure" type="range" min="2" max="12" step="1" value="${ayar.sure}" class="w-full accent-pembe">
          </div>
          <label class="flex items-center gap-2 text-sm font-semibold">
            <input id="dNotlar" type="checkbox" ${ayar.notlar ? 'checked' : ''} class="w-4 h-4 accent-pembe"> ${T('notlari_goster')}

    <div class="flex flex-wrap items-center gap-2 mb-3">

  const c = $('#albumCerceve');

function gruplariCiz(a) {
  const kutu = $('#grupListesi');
  durum.siralayicilar.forEach(s => { try { s.destroy(); } catch (e) {} });
  durum.siralayicilar = [];
  if (!a.gruplar.length) {
    kutu.innerHTML = `<div class="bg-white rounded-3xl shadow-kart p-8 text-center text-soluk">${T('gruplar_bos')}</div>`;
    return;
  }
  kutu.innerHTML = a.gruplar.map((g, i) => `
    <div class="bg-white rounded-3xl shadow-kart p-5" data-grup="${g.id}">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <div class="mr-auto">
          <h4 class="font-baslik text-lg font-semibold">${kacan(g.ad)}</h4>
          <p class="text-xs text-soluk">${T('foto_sayi', {n: g.fotograflar.length})} · ${boyut(g.fotograflar.reduce((t, f) => t + (f.boyut || 0), 0))}</p>
        </div>
        <button class="btn btn-sade" data-g="yukari" ${i === 0 ? 'disabled' : ''}>⬆️</button>
        <button class="btn btn-sade" data-g="asagi" ${i === a.gruplar.length - 1 ? 'disabled' : ''}>⬇️</button>
        <button class="btn btn-sade" data-g="ad">✏️</button>
        <button class="btn btn-sade text-pembe" data-g="sil">🗑️</button>
        <button class="btn btn-foto" data-g="foto">${T('foto_ekle')}</button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3" data-izgara="${g.id}">
        ${g.fotograflar.map((f, j) => `
          <figure class="kare" data-foto="${f.id}">
            <img alt="" data-foto-img="${g.id}|${f.id}">
            <span class="sira">${j + 1}</span>
            <button class="silx" data-silfoto="${f.id}" title="${T('sil2')}">✕</button>
            <figcaption class="absolute bottom-1.5 left-0 right-0 text-center text-[11px] text-soluk truncate px-2">
              ${kacan(f.baslik || (f.not ? T('notlu_kisa') : T('basliksiz')))}
            </figcaption></figure>`).join('')}
      </div>
      ${g.fotograflar.length ? '' : `<p class="text-sm text-soluk py-4 text-center border-2 border-dashed border-cizgi rounded-2xl">${T('grup_bos')}</p>`}
    </div>`).join('');

  $$('#grupListesi img[data-foto-img]').forEach(async img => {
    const [gid, fid] = img.dataset.fotoImg.split('|');
    const g = a.gruplar.find(x => x.id === gid);
    const f = g && g.fotograflar.find(x => x.id === fid);
    if (!f) return;
    const adres = await Depo.fotoAdres(a, g, f);
    if (adres) img.src = adres;
  });

  a.gruplar.forEach(g => {
    const kart = kutu.querySelector(`[data-grup="${g.id}"]`);
    kart.querySelector('[data-g="foto"]').onclick   = () => fotografEkle(a, g);
    kart.querySelector('[data-g="ad"]').onclick     = () => grupAdiDegistir(a, g);
    kart.querySelector('[data-g="sil"]').onclick    = () => grupSil(a, g);
    kart.querySelector('[data-g="yukari"]').onclick = () => grupTasi(a, g, -1);
    kart.querySelector('[data-g="asagi"]').onclick  = () => grupTasi(a, g, 1);
    kart.querySelectorAll('[data-silfoto]').forEach(b => b.onclick = (e) => {
      e.stopPropagation(); fotoSilDirekt(a, g, b.dataset.silfoto);
    });
    kart.querySelectorAll('[data-foto]').forEach(el => el.onclick = () => fotoAc(g.id, el.dataset.foto));
    const izgara = kart.querySelector('[data-izgara]');
    if (window.Sortable) {
      durum.siralayicilar.push(new Sortable(izgara, {
        animation: 160, ghostClass: 'surukleniyor', delay: 120, delayOnTouchOnly: true,
        filter: '.silx', preventOnFilter: false,
        group: 'albumFotograflari',          // fotoğraflar gruplar arasında taşınabilir
        onEnd: async (olay) => {
          const kaynakId = olay.from.dataset.izgara, hedefId = olay.to.dataset.izgara;
          if (kaynakId === hedefId) {
            const sira = Array.from(izgara.children).map(el => el.dataset.foto);
            g.fotograflar.sort((x, y) => sira.indexOf(x.id) - sira.indexOf(y.id));
          } else {
            const kg = a.gruplar.find(x => x.id === kaynakId);
            const hg = a.gruplar.find(x => x.id === hedefId);
            const fotoId = olay.item.dataset.foto;
            const i = kg ? kg.fotograflar.findIndex(f => f.id === fotoId) : -1;
            if (!kg || !hg || i < 0) return;
            const f = kg.fotograflar[i];
            if (Depo.klasorAktif()) {
              // klasör modunda dosyayı da diğer klasöre taşı
              const blob = await Depo.fotoBlob(a, kg, f);
              if (blob) {
                const yeni = await Depo.fotoYaz(a, hg, new File([blob], f.dosyaAdi || 'foto.jpg', {type: blob.type || 'image/jpeg'}));
                await Depo.fotoSil(a, kg, f);
                f.dosyaAdi = yeni.dosyaAdi;
              }
            }
            kg.fotograflar.splice(i, 1);
            hg.fotograflar.splice(Math.max(0, olay.newIndex), 0, f);
          }
          await albumKaydet(a);
          detayCiz();
        }
      }));
    }
  });
}

async function yeniAlbum() {
  const ad = await metinSor({baslik: T('yeni_album'), aciklama: T('album_ad_aciklama'), ipucu: T('ornek_album'),
    dogrula: (v) => !v ? T('ad_gerekli') : durum.albumler.some(a => kucuk(a.ad) === kucuk(v)) ? T('album_var') : null});
  if (!ad) return;
  const grupAdi = dil === 'tr' ? 'Genel' : 'General';
  const a = {id: kimlik(), ad, ithaf: '', etiket: null, gosteri: Object.assign({}, GOSTERI_VARSAYILAN),
             olusturuldu: Date.now(), guncellendi: Date.now(), kapak: null, muzik: null,
             klasor: null, gruplar: [{id: kimlik(), ad: grupAdi, klasor: slug(grupAdi), olusturuldu: Date.now(), fotograflar: []}]};
  if (Depo.klasorAktif()) {
    a.klasor = await Depo.benzersizKlasor(Depo.kok, slug(ad));
    await Depo.kok.getDirectoryHandle(a.klasor, {create: true});
    await Depo.grupDizin(a, a.gruplar[0], true);
  }
  if (durum.etiketler.length) {
    const secim = await etiketSecPencereAc(a);
    if (secim) a.etiket = secim;
  }
  durum.albumler.push(a);
  await albumKaydet(a);
  izle('album_created'); kullanimGonder();
  etiketFiltreCiz(); listeCiz(); onizlemeCiz(); yedekHatirlat(); albumAc(a.id);
  bildir(T('album_hazir'));
}
async function albumAdiDegistir(a) {
  const ad = await metinSor({baslik: T('album_adi'), deger: a.ad, ipucu: T('ornek_album'),
    dogrula: (v) => !v ? T('ad_gerekli') : durum.albumler.some(x => x.id !== a.id && kucuk(x.ad) === kucuk(v)) ? T('album_var') : null});
  if (!ad) return;
  a.ad = ad; await albumKaydet(a); detayCiz(); listeCiz(); onizlemeCiz();
}
async function ithafDegistir(a) {
  const metin = await metinSor({baslik: T('ithaf_baslik'), aciklama: T('ithaf_aciklama'), deger: a.ithaf || '', uzun: true, ipucu: T('ornek_ithaf')});
  if (metin === null) return;
  a.ithaf = metin; await albumKaydet(a); detayCiz(); listeCiz(); onizlemeCiz();
}
async function albumSilAksiyon(a) {
  if (!confirm(T('onay_album_sil', {ad: a.ad}))) return;
  if (!Depo.klasorAktif()) for (const x of tumFotograflar(a)) await Depo.fotoSil(a, x.grup, x.foto);
  await Depo.albumSil(a);
  durum.albumler = durum.albumler.filter(x => x.id !== a.id);
  durum.seciliAlbum = durum.albumler.length ? durum.albumler[0].id : null;
  listeyeDon(); onizlemeCiz();
}
async function yeniGrup(a) {
  const ad = await metinSor({baslik: T('yeni_grup'), aciklama: T('grup_aciklama', {ad: a.ad}), ipucu: T('ornek_grup'),
    dogrula: (v) => !v ? T('ad_gerekli') : a.gruplar.some(g => kucuk(g.ad) === kucuk(v)) ? T('grup_var') : null});
  if (!ad) return;
  const g = {id: kimlik(), ad, klasor: slug(ad), olusturuldu: Date.now(), fotograflar: []};
  if (Depo.klasorAktif()) {
    const dizin = await Depo.albumDizin(a, true);
    g.klasor = await Depo.benzersizKlasor(dizin, slug(ad));
    await dizin.getDirectoryHandle(g.klasor, {create: true});
  }
  a.gruplar.push(g);
  await albumKaydet(a); detayCiz(); listeCiz();
}
async function grupAdiDegistir(a, g) {
  const ad = await metinSor({baslik: T('grup_adi'), deger: g.ad, ipucu: T('ornek_grup'),
    dogrula: (v) => !v ? T('ad_gerekli') : a.gruplar.some(x => x.id !== g.id && kucuk(x.ad) === kucuk(v)) ? T('grup_var') : null});
  if (!ad) return;
  g.ad = ad; await albumKaydet(a); detayCiz();
}
async function grupSil(a, g) {
  if (!confirm(T('onay_grup_sil', {ad: g.ad}))) return;
  if (Depo.klasorAktif()) await Depo.grupKlasorSil(a, g);
  else for (const f of g.fotograflar) await Depo.fotoSil(a, g, f);
  a.gruplar = a.gruplar.filter(x => x.id !== g.id);
  await albumKaydet(a); detayCiz(); listeCiz();
}
async function grupTasi(a, g, yon) {
  const i = a.gruplar.indexOf(g), j = i + yon;
  if (j < 0 || j >= a.gruplar.length) return;
  a.gruplar.splice(j, 0, a.gruplar.splice(i, 1)[0]);
  await albumKaydet(a); detayCiz();
}
async function fotografEkle(a, g) {
  const dosyalar = (await dosyaSec('image/*', true)).filter(d => d.type.startsWith('image/'));
  if (!dosyalar.length) return;
  bekle(T('foto_kaydediliyor', {i: 0, n: dosyalar.length}));
  await imzalariTamamla(a);
  let i = 0, tekrar = 0;
  const yerBekleyen = [];
  for (const d of dosyalar) {
    i++; bekleMetin(T('foto_kaydediliyor', {i, n: dosyalar.length})); bekleOran(i / dosyalar.length * 100);
    const imza = await fotoImza(d);
    if (imza && tumFotograflar(a).some(x => x.foto.imza === imza)) tekrar++;
    const kayit = await Depo.fotoYaz(a, g, d);
    const exif = await exifOku(d);
    const tarih = (exif && exif.tarih) || (d.lastModified ? new Date(d.lastModified).toISOString().slice(0, 10) : '');
    const f = {id: kimlik(), baslik: '', tarih, yer: '', not: '', imza, eklendi: Date.now(), ...kayit};
    if (exif && exif.lat) { f.lat = exif.lat; f.lon = exif.lon; yerBekleyen.push(f); }
    g.fotograflar.push(f);
    if (!a.kapak) a.kapak = f.id;
  }
  await albumKaydet(a);
  bekleKapat();
  detayCiz(); listeCiz(); onizlemeCiz(); yedekHatirlat();
  bugunSeritCiz();
  bildir(T('foto_eklendi', {n: dosyalar.length}));
  izle('photos_added', {count: dosyalar.length}); kullanimGonder();
  if (tekrar) bildir(T('ayni_foto'), 'bilgi');
  if (yerBekleyen.length) {
    yerBekleyen.forEach(f => yerAdiIste(f.lat, f.lon, async (ad) => {
      if (!f.yer) { f.yer = ad; await albumKaydet(a); if (durum.ekran === 'detay') detayCiz(); }
    }));
  }
}

async function fotoAc(grupId, fotoId) {
  const a = albumBul(); if (!a) return;
  const g = a.gruplar.find(x => x.id === grupId);
  const f = g && g.fotograflar.find(x => x.id === fotoId);
  if (!f) return;
  durum.seciliFoto = {grupId, fotoId};
  $('#fotoBuyuk').src = (await Depo.fotoAdres(a, g, f)) || '';
  $('#fotoBaslik').value = f.baslik || '';
  $('#fotoTarih').value = f.tarih || '';
  $('#fotoYer').value = f.yer || '';
  $('#fotoNot').value = f.not || '';
  $('#fotoGrup').innerHTML = a.gruplar.map(x => `<option value="${x.id}" ${x.id === grupId ? 'selected' : ''}>${kacan(x.ad)}</option>`).join('');
  $('#fotoPencere').classList.remove('hidden');
}
function fotoKapat() { $('#fotoPencere').classList.add('hidden'); durum.seciliFoto = null; }
async function fotoKaydet() {
  const a = albumBul(), s = durum.seciliFoto; if (!a || !s) return;
  const g = a.gruplar.find(x => x.id === s.grupId);
  const i = g.fotograflar.findIndex(x => x.id === s.fotoId);
  const f = g.fotograflar[i];
  f.baslik = $('#fotoBaslik').value.trim();
  f.tarih = $('#fotoTarih').value;
  f.yer = $('#fotoYer').value.trim();
  f.not = $('#fotoNot').value.trim();
  const hedefId = $('#fotoGrup').value;
  if (hedefId !== s.grupId) {
    const hedef = a.gruplar.find(x => x.id === hedefId);
    if (Depo.klasorAktif()) {
      const blob = await Depo.fotoBlob(a, g, f);
      if (blob) {
        const yeni = await Depo.fotoYaz(a, hedef, new File([blob], f.dosyaAdi, {type: blob.type}));
        await Depo.fotoSil(a, g, f);
        f.dosyaAdi = yeni.dosyaAdi;
      }
    }
    g.fotograflar.splice(i, 1); hedef.fotograflar.push(f);
  }
  await albumKaydet(a);
  fotoKapat(); detayCiz(); onizlemeCiz();
  bildir(T('kayit_ok'));
}
async function fotoSilDirekt(a, g, fotoId) {
  const i = g.fotograflar.findIndex(x => x.id === fotoId);
  if (i < 0) return;
  const f = g.fotograflar[i];
  if (!confirm(T('onay_foto_sil'))) return;
  await Depo.fotoSil(a, g, f);
  g.fotograflar.splice(i, 1);
  if (a.kapak === f.id) a.kapak = null;
  await albumKaydet(a);
  detayCiz(); listeCiz(); onizlemeCiz();
}
async function fotoSilAksiyon() {
  const a = albumBul(), s = durum.seciliFoto; if (!a || !s) return;
  if (!confirm(T('onay_foto_sil'))) return;
  const g = a.gruplar.find(x => x.id === s.grupId);
  const i = g.fotograflar.findIndex(x => x.id === s.fotoId);
  const f = g.fotograflar[i];
  await Depo.fotoSil(a, g, f);
  g.fotograflar.splice(i, 1);
  if (a.kapak === f.id) a.kapak = null;
  await albumKaydet(a);
  fotoKapat(); detayCiz(); listeCiz();
}
async function fotoKapakYap() {
  const a = albumBul(), s = durum.seciliFoto; if (!a || !s) return;
  a.kapak = s.fotoId; await albumKaydet(a); listeCiz(); bildir(T('kapak_ok'));
}

let muzikAlbumId = null, onizlemeSes = null, onizlemeZaman = null, onizlemeDosya = null;

async function muzikListesiniGetir() {
  try {
    const cevap = await fetch('music/list.json', {cache: 'no-cache'});
    if (!cevap.ok) throw new Error('yok');
    const veri = await cevap.json();
    durum.muzikListesi = Array.isArray(veri) ? veri : (veri.tracks || []);
  } catch { durum.muzikListesi = []; }
  muzikKutuphaneCiz();
}
function muzikKutuphaneCiz() {
  const kutu = $('#muzikKutuphane');
  if (!kutu) return;
  const tumu = durum.muzikListesi;
  const sec = $('#muzikTurFiltre');
  if (!tumu || !tumu.length) {
    if (sec) sec.classList.add('hidden');
    kutu.innerHTML = `<p class="text-soluk text-sm">${T('kutuphane_yok')}</p>`;
    return;
  }
  const turler = [...new Set(tumu.map(m => m.genre || 'ambient'))];
  if (sec) {
    sec.classList.remove('hidden');
    sec.innerHTML = `<option value="">${T('muzik_tur_hepsi')}</option>` +
      turler.map(tr => `<option value="${tr}" ${durum.muzikTur === tr ? 'selected' : ''}>${kacan(T('tur_' + tr))}</option>`).join('');
  }
  const liste = durum.muzikTur ? tumu.filter(m => (m.genre || 'ambient') === durum.muzikTur) : tumu;
  kutu.innerHTML = liste.map((m, i) => `
    <div class="flex items-center gap-2 rounded-2xl border border-cizgi p-2">
      <div class="min-w-0 flex-1">
        <p class="font-semibold text-sm truncate">${kacan(m.title || m.file)}</p>
        <p class="text-xs text-soluk truncate">${kacan(T('tur_' + (m.genre || 'ambient')))} — ${kacan(T('etki_' + (m.genre || 'ambient')))}</p>
      </div>
      <button class="btn btn-sade text-xs shrink-0" data-dinle="${i}">${T('dinle')}</button>
      <button class="btn btn-foto text-xs shrink-0" data-msec="${i}">${T('sec')}</button>
    </div>`).join('');
  if (!liste.length) kutu.innerHTML = `<p class="text-soluk text-sm">${T('kutuphane_yok')}</p>`;
  $$('[data-dinle]', kutu).forEach(b => b.onclick = () => muzikOnizle(liste[+b.dataset.dinle], b));
  $$('[data-msec]', kutu).forEach(b => b.onclick = () => muzikKutuphanedenSec(liste[+b.dataset.msec]));
}
function onizlemeDurdur() {
  if (onizlemeSes) { onizlemeSes.pause(); onizlemeSes = null; }
  onizlemeDosya = null;
  clearTimeout(onizlemeZaman);
  $$('[data-dinle]').forEach(b => b.textContent = T('dinle'));
}
function muzikOnizle(m, dugme) {
  const calan = onizlemeDosya === m.file;
  onizlemeDurdur();
  if (calan) return;
  onizlemeSes = new Audio('music/' + m.file);
  onizlemeDosya = m.file;
  onizlemeSes.volume = .8;
  onizlemeSes.play().catch(() => bildir(T('klasor_hata'), 'hata'));
  izle('music_preview', {genre: m.genre || ''});
  dugme.textContent = T('durdur');
  onizlemeZaman = setTimeout(onizlemeDurdur, 15000);
}
async function muzikKutuphanedenSec(m) {
  const a = durum.albumler.find(x => x.id === muzikAlbumId); if (!a) return;
  onizlemeDurdur();
  bekle(T('hazirlaniyor'));
  try {
    const blob = await (await fetch('music/' + m.file)).blob();
    if (a.muzik && a.muzik.medyaId) await VT.sil('medya', a.muzik.medyaId);
    a.muzik = await Depo.muzikYaz(a, new File([blob], m.file, {type: blob.type || 'audio/mpeg'}));
    a.muzik.ad = m.title || m.file;
    await albumKaydet(a);
    bekleKapat(); muzikPencereKapat(); detayCiz(); listeCiz(); onizlemeCiz();
    bildir(T('muzik_hazir'));
  } catch (e) { bekleKapat(); bildir(T('klasor_hata'), 'hata'); }
}
function muzikPencereAc(a) { muzikAlbumId = a.id; muzikKutuphaneCiz(); $('#muzikPencere').classList.remove('hidden'); }
function muzikPencereKapat() { onizlemeDurdur(); $('#muzikPencere').classList.add('hidden'); }

async function muzikDosyadan() {
  const a = durum.albumler.find(x => x.id === muzikAlbumId); if (!a) return;
  const [d] = await dosyaSec('audio/*', false);
  if (!d) return;
  bekle(T('hazirlaniyor'));
  if (a.muzik && a.muzik.medyaId) await VT.sil('medya', a.muzik.medyaId);
  a.muzik = await Depo.muzikYaz(a, d);
  await albumKaydet(a);
  bekleKapat(); muzikPencereKapat(); detayCiz(); listeCiz(); onizlemeCiz();
  bildir(T('muzik_hazir'));
}

function onizlemeCiz() {
  const sec = $('#onizlemeAlbum');
  if (!durum.seciliAlbum && durum.albumler.length) durum.seciliAlbum = durum.albumler[0].id;
  sec.innerHTML = durum.albumler.map(a => `<option value="${a.id}" ${a.id === durum.seciliAlbum ? 'selected' : ''}>${kacan(a.ad)}</option>`).join('');
  const a = albumBul();
  const kutu = $('#onizlemeOzet');
  if (!a) { kutu.innerHTML = `<p class="text-soluk">${T('album_secilmedi')}</p>`; return; }
  const fotolar = tumFotograflar(a), notlu = fotolar.filter(x => x.foto.not).length;
  const sn = fotolar.length * gosteriAyar(a).sure;
  kutu.innerHTML = `<p class="font-baslik text-lg font-semibold">${kacan(a.ad)}</p>
    ${a.ithaf ? `<p class="italic text-lila">🎁 ${kacan(a.ithaf)}</p>` : ''}
    <p class="text-soluk">${T('foto_sayi', {n: fotolar.length})} · ${T('grup_sayi', {n: a.gruplar.length})} · ${T('notlu', {n: notlu})} · ${boyut(albumBoyut(a))}</p>
    <p class="text-soluk mt-1">${a.muzik ? '🎵 ' + kacan(a.muzik.ad) : T('muzik_yok')} · ⏱️ ${Math.floor(sn/60)}:${String(sn%60).padStart(2,'0')}</p>`;
}

const Gosteri = {liste: [], sira: 0, zaman: null, oynuyor: false, ses: null, mevcutEl: null, gizleZaman: null, ayar: GOSTERI_VARSAYILAN};

async function gosteriBaslat() {
  const secim = $('#onizlemeAlbum').value;
  if (secim) durum.seciliAlbum = secim;
  const a = albumBul();
  if (!a) return bildir(T('once_album'), 'hata');
  const fotolar = tumFotograflar(a);
  if (!fotolar.length) return bildir(T('foto_yok'), 'hata');

  const perde = $('#gosteri');
  perde.classList.remove('hidden');
  if (perde.requestFullscreen) perde.requestFullscreen().catch(() => {});
  $('#gosteriSahne').innerHTML = ''; $('#gosteriYazi').innerHTML = ''; $('#gosteriGrup').textContent = '';
  $('#gosteriBitti').classList.add('hidden');
  bekle(T('hazirlaniyor'));
  Gosteri.liste = [];
  for (const x of fotolar) {
    const adres = await Depo.fotoAdres(a, x.grup, x.foto);
    if (adres) Gosteri.liste.push({...x.foto, grupAdi: x.grupAdi, adres});
  }
  bekleKapat();
  if (!Gosteri.liste.length) { gosteriKapat(); return bildir(T('foto_yok'), 'hata'); }

  $('#gosteriAlbum').textContent = a.ad;
  Gosteri.ayar = gosteriAyar(a);
  Gosteri.mevcutEl = null; Gosteri.sira = 0; Gosteri.oynuyor = true;
  $('#gosteriDur').textContent = '⏸️';
  const muzik = await Depo.muzikAdres(a);
  if (muzik) {
    Gosteri.ses = new Audio(muzik);
    Gosteri.ses.loop = true; Gosteri.ses.crossOrigin = 'anonymous'; Gosteri.ses.volume = .85;
    Gosteri.ses.play().catch(() => bildir(T('muzik_ekrana_dokun'), 'bilgi'));
  }
  if (a.ithaf) {
    $('#gosteriYazi').innerHTML = `<p class="font-baslik text-2xl md:text-4xl font-semibold drop-shadow-lg">${kacan(a.ithaf)}</p>`;
    await new Promise(r => setTimeout(r, 3200));
  }
  await slaytGoster(0);
  izle('slideshow_started', {photos: Gosteri.liste.length});
  kontrolGizleSayaci();
}
async function slaytGoster(i) {
  const oge = Gosteri.liste[i];
  if (!oge) return;
  Gosteri.sira = i;
  const tema = Gosteri.ayar.tema, sure = Gosteri.ayar.sure * 1000;
  const img = document.createElement('img');
  img.className = 'slayt ' + tema;
  img.style.setProperty('--sure', (sure + 900) + 'ms');
  img.src = oge.adres;
  $('#gosteriSahne').appendChild(img);
  requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('iceri')));
  const eski = Gosteri.mevcutEl;
  Gosteri.mevcutEl = img;
  if (eski) { eski.classList.add('disari'); setTimeout(() => eski.remove(), 900); }

  $('#gosteriGrup').textContent = '🗂️ ' + oge.grupAdi;
  const yazi = $('#gosteriYazi');
  if (Gosteri.ayar.notlar) {
    const ust = [oge.baslik, tarihMetin(oge.tarih), oge.yer ? '📍 ' + oge.yer : ''].filter(Boolean).join('  ·  ');
    yazi.innerHTML = (ust ? `<p class="font-baslik text-xl md:text-2xl font-semibold drop-shadow-lg">${kacan(ust)}</p>` : '') +
      (oge.not ? `<p class="mt-1 text-sm md:text-base text-white/85 max-w-2xl mx-auto drop-shadow">${kacan(oge.not)}</p>` : '');
  } else yazi.innerHTML = '';

  $('#gosteriSayac').textContent = `${i + 1} / ${Gosteri.liste.length}`;
  const cubuk = $('#gosteriCubuk');
  cubuk.style.transition = 'none'; cubuk.style.width = '0%'; void cubuk.offsetWidth;
  if (Gosteri.oynuyor) { cubuk.style.transition = `width ${sure}ms linear`; cubuk.style.width = '100%'; }
  clearTimeout(Gosteri.zaman);
  if (Gosteri.oynuyor) {
    // tek tur: son fotoğraftan sonra başa dönmez, biter
    Gosteri.zaman = setTimeout(() => {
      if (i + 1 >= Gosteri.liste.length) gosteriBittiGoster();
      else slaytGoster(i + 1);
    }, sure);
  }
}
function gosteriBittiGoster() {
  clearTimeout(Gosteri.zaman);
  Gosteri.oynuyor = false;
  if (Gosteri.ses) Gosteri.ses.pause();
  $('#gosteri').classList.remove('sakin');
  $('#gosteriBitti').classList.remove('hidden');
  const c = $('#gosteriCubuk'); c.style.transition = 'none'; c.style.width = '100%';
}
async function gosteriTekrarOynat() {
  $('#gosteriBitti').classList.add('hidden');
  Gosteri.oynuyor = true;
  $('#gosteriDur').textContent = '⏸️';
  if (Gosteri.ses) { Gosteri.ses.currentTime = 0; Gosteri.ses.play().catch(() => {}); }
  await slaytGoster(0);
  kontrolGizleSayaci();
}
function slaytIlerle(yon) {
  if (!Gosteri.liste.length) return;
  $('#gosteriBitti').classList.add('hidden');
  slaytGoster((Gosteri.sira + yon + Gosteri.liste.length) % Gosteri.liste.length);
}
function gosteriDurdur() {
  Gosteri.oynuyor = !Gosteri.oynuyor;
  $('#gosteriDur').textContent = Gosteri.oynuyor ? '⏸️' : '▶️';
  if (Gosteri.ses) Gosteri.oynuyor ? Gosteri.ses.play().catch(() => {}) : Gosteri.ses.pause();
  if (Gosteri.oynuyor) slaytGoster(Gosteri.sira);
  else { clearTimeout(Gosteri.zaman); const c = $('#gosteriCubuk'); c.style.transition = 'none'; c.style.width = getComputedStyle(c).width; }
}
function gosteriKapat() {
  clearTimeout(Gosteri.zaman); clearTimeout(Gosteri.gizleZaman);
  Gosteri.oynuyor = false;
  if (Gosteri.ses) { Gosteri.ses.pause(); Gosteri.ses = null; }
  $('#gosteri').classList.add('hidden');
  $('#gosteriBitti').classList.add('hidden');
  $('#gosteriSahne').innerHTML = '';
  Gosteri.mevcutEl = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
function tamEkranDegistir() {
  const el = $('#gosteri');
  if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
function kontrolGizleSayaci() {
  const el = $('#gosteri');
  el.classList.remove('sakin');
  clearTimeout(Gosteri.gizleZaman);
  Gosteri.gizleZaman = setTimeout(() => el.classList.add('sakin'), 3000);
}

/* Takvimlerde günlere iliştirilen notlar merkezi bir havuzda tutulur;

const notNesne = (n) => {
  if (!n) return null;
  if (typeof n === 'string') return {metin: n, emoji: ''};
  if (n.ref) {
    const tanim = durum.notTanimlari.find(x => x.id === n.ref);
    return tanim ? {metin: tanim.metin, emoji: tanim.emoji, ref: n.ref} : null;
  }
  return n;
};
async function notTanimEkle(metin, emoji) {
  const mevcut = durum.notTanimlari.find(x => kucuk(x.metin) === kucuk(metin) && (x.emoji || '') === (emoji || ''));
  if (mevcut) return mevcut;
  const tanim = {id: kimlik(), metin, emoji: emoji || ''};
  durum.notTanimlari.push(tanim);
  await ayarYaz('notTanimlari', durum.notTanimlari);
  return tanim;
}
const notTanimKullanim = (id) => durum.takvimler.reduce((t, tk) =>
  t + Object.values(tk.notlar || {}).filter(n => n && n.ref === id).length, 0);
function acikMi(renk) {
  const m = /^#?([0-9a-f]{6})$/i.exec((renk || '').trim());
  if (!m) return true;
  const s = parseInt(m[1], 16);
  const l = .2126 * ((s >> 16) & 255) + .7152 * ((s >> 8) & 255) + .0722 * (s & 255);
  return l > 150;
}
/* Şablonun kendi renkleri ile kullanıcının seçtikleri burada birleşir */
function sablonRenk(t) {
  const sb = sablonBul(t.sablon), oz = takvimOzel(t);
  const zemin = oz.zemin || sb.zemin;
  const acik = acikMi(zemin);
  return {
    zemin, vurgu: oz.vurgu || sb.vurgu,
    metin: oz.zemin ? (acik ? '#2F2A35' : '#F5F2F7') : sb.metin,
    soluk: oz.zemin ? (acik ? '#9A93A3' : '#8C8496') : sb.soluk,
    cizgi: oz.zemin ? (acik ? 'rgba(47,42,53,.12)' : 'rgba(255,255,255,.16)') : sb.cizgi,
    kartZemin: acik ? '255,255,255' : '28,24,34',
    saydamlik: Math.max(0, Math.min(100, oz.saydamlik)) / 100,
    fotoUyum: oz.fotoUyum
  };
}
const takvimBoyut = (tip) => tip === 'masa' ? {G: 1000, Y: 707} : {G: 707, Y: 1000};

const ULKELER = ['TR','US','GB','DE','FR','IT','ES','NL','BE','AT','CH','SE','NO','DK','FI','PL','CZ','GR','PT','IE','CA','AU','JP','BR','MX'];

const ayAdi = (yil, ay) => new Date(yil, ay - 1, 1).toLocaleDateString(yerelKod(), {month: 'long'});

function gunAdlari(haftaBaslangic) {
  const adlar = [];
  for (let i = 0; i < 7; i++) {
    const kaydir = haftaBaslangic === 1 ? i : (i + 6) % 7;
    adlar.push(new Date(2024, 0, 1 + kaydir).toLocaleDateString(yerelKod(), {weekday: 'short'}));
  }

}
async function tatilleriGetir(yil, ulke) {
  if (!ulke) return {};
